對象，白費口舌", "story": "春秋時期，音樂家公明儀對著牛彈奏高雅的樂曲，牛只顧吃草，毫無反應。比喻對不懂的人講道理，完全沒有效果。", "question": "「對牛彈琴」是什麼意思？", "options": ["牛很喜歡音樂", "在牛旁邊彈琴", "牛聽到音樂跳舞", "比喻說話不看對象，白費口舌"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 9, "chengyu": "三心二意", "meaning": "形容做事不專心，猶豫不決", "story": "形容一個人心思不定，做事情時這樣想又那樣想，無法專注，猶豫不決，難以做出決定。", "question": "「三心二意」是什麼意思？", "options": ["形容做事不專心，猶豫不決", "有三顆心", "心意很多", "三個人的心意"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "數字"}, {"id": 10, "chengyu": "狐假虎威", "meaning": "借助別人的威勢來欺壓他人", "story": "老虎抓住狐狸，狐狸說自己是天帝派來的，老虎不信，狐狸便讓老虎跟在後面走，百獸見了都逃跑。老虎以為是怕狐狸，其實是怕自己。", "question": "「狐假虎威」是什麼意思？", "options": ["狐狸假裝是老虎", "借助別人的威勢來欺壓他人", "老虎和狐狸是朋友", "狐狸很厲害"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 11, "chengyu": "掩耳盜鈴", "meaning": "自己欺騙自己，以為別人不知道", "story": "有人想偷一口鐘，但鐘太大搬不走，便用錘子砸，鐘發出巨響。他以為捂住自己的耳朵，別人就聽不到了，結果被人發現。", "question": "「掩耳盜鈴」是什麼意思？", "options": ["偷鈴鐺的故事", "耳朵聽不到鈴聲", "自己欺騙自己，以為別人不知道", "把鈴鐺藏起來"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "生活"}, {"id": 12, "chengyu": "井底之蛙", "meaning": "比喻見識短淺，眼光狹窄的人", "story": "《莊子》中，住在井底的青蛙向東海的大龜誇耀井中的快樂，大龜告訴牠大海的廣闊，青蛙才知道自己見識太短淺了。", "question": "「井底之蛙」是什麼意思？", "options": ["住在井裡的青蛙", "青蛙跳出井的故事", "井裡有很多青蛙", "比喻見識短淺，眼光狹窄的人"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 13, "chengyu": "虎頭蛇尾", "meaning": "形容做事起初聲勢很大，後來卻草草了事", "story": "比喻開始時像老虎頭一樣氣勢威猛，但到了後來卻像蛇尾巴一樣細小無力，形容做事有始無終。", "question": "「虎頭蛇尾」是什麼意思？", "options": ["形容做事起初聲勢很大，後來卻草草了事", "老虎和蛇的故事", "動物的身體部位", "頭大尾小的動物"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 14, "chengyu": "雞犬不寧", "meaning": "形容騷擾得很厲害，連雞狗都不得安寧", "story": "唐代柳宗元《捕蛇者說》中描述官吏徵稅時騷擾百姓，連雞和狗都不得安寧，形容擾亂得非常厲害。", "question": "「雞犬不寧」是什麼意思？", "options": ["雞和狗打架", "形容騷擾得很厲害，連雞狗都不得安寧", "農場很熱鬧", "養了很多雞和狗"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 15, "chengyu": "一鳴驚人", "meaning": "比喻平時默默無聞，突然做出驚人的成就", "story": "楚莊王即位三年，不理朝政，大臣問他，他說：「此鳥三年不飛，一飛沖天；三年不鳴，一鳴驚人。」後來果然成為一代霸主。", "question": "「一鳴驚人」是什麼意思？", "options": ["鳥叫聲很大", "驚嚇到別人", "比喻平時默默無聞，突然做出驚人的成就", "一個人大叫"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 16, "chengyu": "自相矛盾", "meaning": "比喻說話或行為前後不一致，互相抵觸", "story": "楚國有個賣矛和盾的人，說盾最堅固，又說矛最鋒利。有人問：「用你的矛刺你的盾，結果如何？」他啞口無言。", "question": "「自相矛盾」是什麼意思？", "options": ["矛和盾互相攻擊", "武器很厲害", "賣武器的故事", "比喻說話或行為前後不一致，互相抵觸"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "生活"}, {"id": 17, "chengyu": "杯水車薪", "meaning": "比喻力量太小，無法解決問題", "story": "用一杯水去救一車著火的柴，根本無濟於事。比喻所做的努力與需要解決的問題相比，力量實在太小，無法起到作用。", "question": "「杯水車薪」是什麼意思？", "options": ["比喻力量太小，無法解決問題", "用杯子喝水", "車子裝滿水", "一杯水和一車柴"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "生活"}, {"id": 18, "chengyu": "愚公移山", "meaning": "比喻有恆心和毅力，堅持不懈地做事", "story": "愚公年近九十，決心移走門前兩座大山。智叟嘲笑他，他說子子孫孫無窮盡，山不會增高，終能移走。天帝被感動，命神仙移走了山。", "question": "「愚公移山」是什麼意思？", "options": ["搬山的故事", "山很難移動", "老人很笨", "比喻有恆心和毅力，堅持不懈地做事"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "學習"}, {"id": 19, "chengyu": "拔苗助長", "meaning": "比喻急於求成，反而壞事", "story": "宋國有個農夫，嫌禾苗長得太慢，便把每棵苗都往上拔高一些，回家後說今天幫苗長高了。結果第二天禾苗全部枯死了。", "question": "「拔苗助長」是什麼意思？", "options": ["幫助植物生長", "農夫很勤勞", "比喻急於求成，反而壞事", "苗長得很快"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "學習"}, {"id": 20, "chengyu": "坐井觀天", "meaning": "比喻眼界狹小，所見有限", "story": "坐在井底仰望天空，只能看到井口那麼大的一片天。比喻一個人因為環境或見識的限制，眼界非常狹小。", "question": "「坐井觀天」是什麼意思？", "options": ["坐在井邊看天空", "天空很美麗", "井很深", "比喻眼界狹小，所見有限"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "生活"}, {"id": 21, "chengyu": "一箭雙鵰", "meaning": "一個行動達到兩個目的", "story": "北周時期，長孫晟射箭，一箭射穿兩隻大雕。後來比喻一個行動同時達到兩個目的，與「一石二鳥」意思相近。", "question": "「一箭雙鵰」是什麼意思？", "options": ["一個行動達到兩個目的", "射箭技術很好", "射中兩隻大鳥", "箭法精準"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 22, "chengyu": "五花八門", "meaning": "形容種類繁多，變化多端", "story": "原指古代兵法中的陣法名稱，後來泛指各種各樣的事物，形容種類繁多，花樣百出，令人眼花繚亂。", "question": "「五花八門」是什麼意思？", "options": ["五朵花和八扇門", "形容種類繁多，變化多端", "花園很漂亮", "門的種類"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "數字"}, {"id": 23, "chengyu": "七上八下", "meaning": "形容心情不安，忐忑不定", "story": "形容心裡像有東西在上下翻騰，忐忑不安，無法平靜。常用來描述緊張、擔心或不確定時的心理狀態。", "question": "「七上八下」是什麼意思？", "options": ["數字七和八", "上下移動", "樓梯的層數", "形容心情不安，忐忑不定"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "數字"}, {"id": 24, "chengyu": "一毛不拔", "meaning": "形容人非常吝嗇，一點都不肯付出", "story": "《孟子》中記載楊朱的學說「拔一毛而利天下，不為也」，後來「一毛不拔」用來形容極度吝嗇的人。", "question": "「一毛不拔」是什麼意思？", "options": ["頭髮很多", "不願意拔毛", "毛很珍貴", "形容人非常吝嗇，一點都不肯付出"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "小學生"}, {"id": 25, "chengyu": "口是心非", "meaning": "嘴上說的和心裡想的不一樣，表裡不一", "story": "形容一個人說話和心裡想的完全相反，表面上說好聽的話，但內心卻有另外的打算，是一種虛偽的表現。", "question": "「口是心非」是什麼意思？", "options": ["嘴上說的和心裡想的不一樣，表裡不一", "嘴巴說錯話", "心口不一致", "說話很奇怪"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 26, "chengyu": "大材小用", "meaning": "比喻有才能的人被安排做不重要的工作", "story": "把大塊的木材用來做小東西，是一種浪費。比喻有大才能的人被安排在不重要的職位上，才能無法得到充分發揮。", "question": "「大材小用」是什麼意思？", "options": ["大的材料做小東西", "比喻有才能的人被安排做不重要的工作", "浪費材料", "材料的大小"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 27, "chengyu": "天下無雙", "meaning": "形容某人或某物是天下最好的，無人能比", "story": "形容某人或某物在天下間是獨一無二的，沒有任何人或事物能與之相比，是最高的讚美。", "question": "「天下無雙」是什麼意思？", "options": ["天下只有一個", "沒有雙胞胎", "形容某人或某物是天下最好的，無人能比", "天下很大"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 28, "chengyu": "小題大做", "meaning": "把小事情當成大事來處理，過於誇張", "story": "把一件小事情誇大處理，用過多的精力和資源去應對，顯得不必要地誇張和小題大做。", "question": "「小題大做」是什麼意思？", "options": ["做小題目", "題目很小", "大題目做完了", "把小事情當成大事來處理，過於誇張"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 29, "chengyu": "不知不覺", "meaning": "沒有察覺到，在不知道的情況下發生", "story": "形容事情在不知不覺中發生，當事人完全沒有意識到，等到發現時已經過了很長時間或事情已經發生了。", "question": "「不知不覺」是什麼意思？", "options": ["沒有察覺到，在不知道的情況下發生", "不知道也不覺得", "知道了才覺得", "覺得很奇怪"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "小學生"}, {"id": 30, "chengyu": "手忙腳亂", "meaning": "形容做事慌張，不知所措", "story": "形容一個人在忙碌或緊急情況下，手腳都不知道該怎麼辦，顯得非常慌亂，無法冷靜應對。", "question": "「手忙腳亂」是什麼意思？", "options": ["手和腳都很忙", "形容做事慌張，不知所措", "跑步很快", "工作很多"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 31, "chengyu": "見多識廣", "meaning": "見過很多事物，知識豐富", "story": "形容一個人經歷豐富，見過很多事物，因此知識廣博，見解深刻，能夠應對各種情況。", "question": "「見多識廣」是什麼意思？", "options": ["眼睛看得很遠", "認識很多人", "見過很多事物，知識豐富", "廣泛閱讀"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 32, "chengyu": "心想事成", "meaning": "心裡想的事情都能實現", "story": "形容一個人所有的願望和計劃都能順利實現，是對他人最美好的祝願，常用於祝福語中。", "question": "「心想事成」是什麼意思？", "options": ["想了很多事情", "做事很成功", "心情很好", "心裡想的事情都能實現"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 33, "chengyu": "千方百計", "meaning": "想盡各種辦法", "story": "形容為了達到某個目的，想盡了各種各樣的方法和計策，不放棄任何可能的途徑。", "question": "「千方百計」是什麼意思？", "options": ["想盡各種辦法", "一千種方法", "計劃很多", "方法很好"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "數字"}, {"id": 34, "chengyu": "風平浪靜", "meaning": "比喻平靜無事，沒有紛爭", "story": "海面上風停了，浪也平靜了，形容環境非常平靜。後來比喻局勢或生活平靜，沒有任何紛爭和波折。", "question": "「風平浪靜」是什麼意思？", "options": ["天氣很好", "比喻平靜無事，沒有紛爭", "海浪很小", "風停了"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 35, "chengyu": "百發百中", "meaning": "形容射擊或做事每次都能命中目標", "story": "形容箭術高超，每次射箭都能命中目標。後來泛指做任何事情都能準確達到目的，從不失手。", "question": "「百發百中」是什麼意思？", "options": ["射了一百次", "百分之百成功", "形容射擊或做事每次都能命中目標", "射箭很準"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "數字"}, {"id": 36, "chengyu": "異口同聲", "meaning": "大家說的話完全一樣，意見一致", "story": "形容很多人同時說出相同的話，意見完全一致，沒有任何分歧，表示大家對某件事有共同的看法。", "question": "「異口同聲」是什麼意思？", "options": ["不同的聲音", "一個人說話", "聲音很大", "大家說的話完全一樣，意見一致"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 37, "chengyu": "半信半疑", "meaning": "有些相信，有些懷疑，態度不確定", "story": "形容對某件事情或某人的話，既有一些相信，又有一些懷疑，態度猶豫不決，無法完全確定。", "question": "「半信半疑」是什麼意思？", "options": ["有些相信，有些懷疑，態度不確定", "相信一半", "完全不相信", "非常相信"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 38, "chengyu": "有備無患", "meaning": "事先做好準備，就不會有後患", "story": "出自《左傳》，意思是事先做好充分的準備，就可以避免日後的憂患和麻煩。強調凡事要未雨綢繆。", "question": "「有備無患」是什麼意思？", "options": ["有準備沒有問題", "事先做好準備，就不會有後患", "備用品很重要", "患難與共"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 39, "chengyu": "無中生有", "meaning": "本來沒有的事情，憑空捏造出來", "story": "出自老子《道德經》，原指從無到有的哲學概念。後來比喻憑空捏造，把根本不存在的事情說成真實存在的。", "question": "「無中生有」是什麼意思？", "options": ["創造新事物", "從無到有", "本來沒有的事情，憑空捏造出來", "沒有東西"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 40, "chengyu": "得意忘形", "meaning": "因為高興或得意而忘乎所以，失去常態", "story": "形容一個人因為取得成功或受到讚美而過於高興，以至於忘記了自己的身份和應有的行為，舉止失常。", "question": "「得意忘形」是什麼意思？", "options": ["忘記了形狀", "得到了很多", "形狀很奇怪", "因為高興或得意而忘乎所以，失去常態"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 41, "chengyu": "臥薪嘗膽", "meaning": "形容刻苦自勵，發憤圖強", "story": "越王勾踐被吳王夫差打敗後，睡在柴草上，每天嘗一口苦膽，提醒自己不忘恥辱，最終發憤圖強，滅掉了吳國。", "question": "「臥薪嘗膽」是什麼意思？", "options": ["形容刻苦自勵，發憤圖強", "吃苦的食物", "睡覺很不舒服", "睡在柴草上嘗苦膽"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 42, "chengyu": "破釜沉舟", "meaning": "比喻下定決心，不留退路", "story": "項羽渡河攻打秦軍，命令士兵砸破鍋（釜）、鑿沉船隻，只帶三天糧食，表示有進無退的決心，最終大敗秦軍。", "question": "「破釜沉舟」是什麼意思？", "options": ["打破鍋子沉船", "比喻下定決心，不留退路", "船沉了很危險", "廚具壞了"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 43, "chengyu": "葉公好龍", "meaning": "比喻表面上喜歡，實際上並不真正喜歡", "story": "葉公非常喜愛龍，家裡到處畫著龍。真龍聽說後從天而降，葉公卻嚇得魂飛魄散。比喻表面喜歡，實際上並不真心。", "question": "「葉公好龍」是什麼意思？", "options": ["葉公養了一條龍", "龍喜歡葉公", "比喻表面上喜歡，實際上並不真正喜歡", "葉公的故事"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "動物"}, {"id": 44, "chengyu": "杯弓蛇影", "meaning": "比喻因疑神疑鬼而自己嚇自己", "story": "晉代有人在朋友家喝酒，看見杯中有蛇影，回家後生病了。後來才知道那是牆上弓的倒影。比喻因多疑而自己嚇自己。", "question": "「杯弓蛇影」是什麼意思？", "options": ["杯子裡有蛇", "弓箭射蛇", "喝酒看到幻覺", "比喻因疑神疑鬼而自己嚇自己"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 45, "chengyu": "塞翁失馬", "meaning": "比喻壞事也可能變成好事，禍福難以預料", "story": "邊塞老翁的馬跑走了，眾人安慰他，他說未必是壞事。後來馬帶回一匹好馬，兒子騎馬摔斷腿，又因此免去了從軍。", "question": "「塞翁失馬」是什麼意思？", "options": ["比喻壞事也可能變成好事，禍福難以預料", "老人的馬跑掉了", "馬跑到邊塞", "老人很傷心"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 46, "chengyu": "鑿壁偷光", "meaning": "形容勤奮苦學，克服困難求學", "story": "西漢匡衡家貧，買不起燈油，便在牆上鑿了個洞，借鄰居家的燈光讀書。後來他成為著名的學者，官至丞相。", "question": "「鑿壁偷光」是什麼意思？", "options": ["在牆上鑿洞偷看", "形容勤奮苦學，克服困難求學", "偷別人的燈", "牆壁有個洞"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "學習"}, {"id": 47, "chengyu": "班門弄斧", "meaning": "在行家面前賣弄本領，不自量力", "story": "魯班是古代著名的木匠，在他門前舞弄斧頭，是不自量力的表現。比喻在行家面前賣弄自己的本領。", "question": "「班門弄斧」是什麼意思？", "options": ["在木匠家門口玩斧頭", "斧頭很厲害", "在行家面前賣弄本領，不自量力", "班門的工具"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 48, "chengyu": "南轅北轍", "meaning": "行動和目標完全相反，背道而馳", "story": "有人要去南方，卻駕車向北走。別人告訴他走錯了，他說馬好、錢多、車夫技術好，但方向相反，永遠到不了目的地。", "question": "「南轅北轍」是什麼意思？", "options": ["往南往北都可以", "車子走錯方向", "南北都有路", "行動和目標完全相反，背道而馳"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 49, "chengyu": "濫竽充數", "meaning": "沒有真才實學，混在其中充數", "story": "齊宣王喜歡聽三百人合奏竽，南郭先生不會吹竽，卻混在其中充數。齊湣王喜歡聽獨奏，南郭先生只好逃走了。", "question": "「濫竽充數」是什麼意思？", "options": ["沒有真才實學，混在其中充數", "竽的數量很多", "吹竽的樂師", "樂隊裡的人"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 50, "chengyu": "刻舟求劍", "meaning": "比喻拘泥固執，不知道隨情況變化而應變", "story": "楚國人乘船過江，劍掉入水中，他在船邊刻了個記號，說劍是從這裡掉的。船到對岸，他從記號處下水找劍，當然找不到。", "question": "「刻舟求劍」是什麼意思？", "options": ["在船上刻字找劍", "比喻拘泥固執，不知道隨情況變化而應變", "劍掉進水裡", "船上有劍"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 51, "chengyu": "胸有成竹", "meaning": "做事之前已有充分準備和把握", "story": "宋代畫家文與可畫竹子前，心中已有完整的竹子形象。蘇軾為此寫詩讚美，後來「胸有成竹」比喻做事前已有充分準備。", "question": "「胸有成竹」是什麼意思？", "options": ["胸口畫了竹子", "竹子長在胸前", "做事之前已有充分準備和把握", "心裡很平靜"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 52, "chengyu": "望洋興嘆", "meaning": "比喻因力量不夠而感到無可奈何", "story": "《莊子》中，河神見到大海後，感嘆自己的渺小。比喻看到別人的偉大或面對困難時，感到自己力量不足，無可奈何。", "question": "「望洋興嘆」是什麼意思？", "options": ["看海很感動", "大海很壯觀", "嘆氣的故事", "比喻因力量不夠而感到無可奈何"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 53, "chengyu": "買櫝還珠", "meaning": "比喻取捨不當，捨本逐末", "story": "楚國人賣珍珠，用精美的木盒裝著。鄭國人買了木盒，卻把珍珠還給了賣家。比喻只注重外表，忽略了真正有價值的東西。", "question": "「買櫝還珠」是什麼意思？", "options": ["比喻取捨不當，捨本逐末", "買了盒子還了珍珠", "珍珠很貴", "木盒很漂亮"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 54, "chengyu": "朝三暮四", "meaning": "比喻反覆無常，善變", "story": "宋國人養猴子，說早上給三個橡子，晚上給四個，猴子不高興。改說早上四個，晚上三個，猴子高興了。比喻善用手段欺騙或反覆無常。", "question": "「朝三暮四」是什麼意思？", "options": ["早上三個晚上四個", "比喻反覆無常，善變", "猴子的故事", "數字三和四"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 55, "chengyu": "畫蛇添足", "meaning": "比喻多此一舉，反而壞事", "story": "幾人比賽畫蛇，一人先畫完，見別人還在畫，便給蛇添上了腳。另一人畫完說蛇本無腳，拿走了酒。比喻多此一舉，弄巧成拙。", "question": "「畫蛇添足」是什麼意思？", "options": ["給蛇畫腳", "蛇有腳", "比喻多此一舉，反而壞事", "畫畫比賽"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "生活"}, {"id": 56, "chengyu": "指鹿為馬", "meaning": "比喻顛倒是非，混淆黑白", "story": "秦朝趙高把鹿獻給秦二世，說是馬。大臣們有的說是馬，有的說是鹿，趙高把說是鹿的大臣都殺了，以此測試誰忠於自己。", "question": "「指鹿為馬」是什麼意思？", "options": ["鹿和馬很像", "指著動物說名字", "趙高的故事", "比喻顛倒是非，混淆黑白"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "動物"}, {"id": 57, "chengyu": "一諾千金", "meaning": "形容說話算數，承諾非常可靠", "story": "秦末有個叫季布的人，說話算數，凡是答應的事情一定做到。當時流傳「得黃金百斤，不如得季布一諾」的說法。", "question": "「一諾千金」是什麼意思？", "options": ["形容說話算數，承諾非常可靠", "一個承諾值千金", "金錢很重要", "諾言很貴"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "數字"}, {"id": 58, "chengyu": "明察秋毫", "meaning": "形容觀察力非常敏銳，能看清細微的事物", "story": "秋天動物換毛，新生的毛非常細小。能看清秋毫，比喻觀察力極其敏銳，能發現極細微的事物或問題。", "question": "「明察秋毫」是什麼意思？", "options": ["秋天的毛髮", "形容觀察力非常敏銳，能看清細微的事物", "觀察秋天", "眼睛很好"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 59, "chengyu": "螳螂捕蟬", "meaning": "比喻只顧眼前利益，不知道後面有危險", "story": "螳螂正要捕捉蟬，卻不知道後面有黃雀要吃牠。比喻只顧眼前的利益，卻不知道身後有更大的危險正在逼近。", "question": "「螳螂捕蟬」是什麼意思？", "options": ["螳螂吃蟬", "昆蟲的故事", "比喻只顧眼前利益，不知道後面有危險", "螳螂很厲害"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "動物"}, {"id": 60, "chengyu": "一葉障目", "meaning": "比喻被局部現象所迷惑，看不到全局", "story": "《鶡冠子》中說，一片葉子遮住了眼睛，就看不見泰山。比喻被眼前的小事物所遮蔽，看不到更大的真相或全局。", "question": "「一葉障目」是什麼意思？", "options": ["葉子遮住眼睛", "樹葉很大", "眼睛被遮住了", "比喻被局部現象所迷惑，看不到全局"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 61, "chengyu": "以卵擊石", "meaning": "比喻不自量力，自取滅亡", "story": "用雞蛋去撞石頭，雞蛋必然粉碎。比喻以弱小的力量去對抗強大的對手，完全不自量力，只會自取失敗。", "question": "「以卵擊石」是什麼意思？", "options": ["比喻不自量力，自取滅亡", "用蛋打石頭", "石頭很硬", "雞蛋很脆弱"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 62, "chengyu": "緣木求魚", "meaning": "比喻方法不對，根本達不到目的", "story": "爬到樹上去找魚，當然找不到。比喻方向或方法完全錯誤，無論多努力都不可能達到目的，徒勞無功。", "question": "「緣木求魚」是什麼意思？", "options": ["在樹上找魚", "比喻方法不對，根本達不到目的", "魚在樹上", "找魚的方法"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 63, "chengyu": "弄巧成拙", "meaning": "本想耍聰明，結果反而把事情弄壞了", "story": "形容一個人想用聰明的方法把事情做得更好，結果卻因為過於刻意或方法不當，反而把事情搞砸了。", "question": "「弄巧成拙」是什麼意思？", "options": ["技巧很好", "笨手笨腳", "本想耍聰明，結果反而把事情弄壞了", "聰明反被聰明誤"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 64, "chengyu": "一網打盡", "meaning": "比喻把所有的人或事物全部捉住或消滅", "story": "用一張網把所有的魚都捕獲。比喻一次行動就把所有的目標全部捉住，不留一個漏網之魚。", "question": "「一網打盡」是什麼意思？", "options": ["用網捕魚", "網很大", "捕魚技術好", "比喻把所有的人或事物全部捉住或消滅"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 65, "chengyu": "過河拆橋", "meaning": "比喻達到目的後，就拋棄幫助過自己的人", "story": "過了河之後就把橋拆掉，讓後來的人無法通過。比喻利用別人達到目的後，就拋棄或陷害那個幫助過自己的人。", "question": "「過河拆橋」是什麼意思？", "options": ["比喻達到目的後，就拋棄幫助過自己的人", "橋壞了需要拆", "過橋的故事", "拆橋很危險"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 66, "chengyu": "一步一個腳印", "meaning": "形容做事踏實認真，一步一步地前進", "story": "走路時每一步都留下腳印，形容做事情非常踏實，不投機取巧，一步一步認真地向前推進，不急於求成。", "question": "「一步一個腳印」是什麼意思？", "options": ["走路很慢", "形容做事踏實認真，一步一步地前進", "腳印很清晰", "走了很多路"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 67, "chengyu": "紙醉金迷", "meaning": "形容奢侈豪華、放蕩享樂的生活", "story": "形容生活極度奢侈，沉迷於豪華享樂之中，整天花天酒地，不知節制，是一種腐化墮落的生活方式。", "question": "「紙醉金迷」是什麼意思？", "options": ["紙和金子", "喝醉了", "形容奢侈豪華、放蕩享樂的生活", "金錢的誘惑"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 68, "chengyu": "馬首是瞻", "meaning": "比喻跟隨別人的指揮行動", "story": "古代打仗時，士兵以主將的馬頭方向為行動方向。後來比喻跟隨某人的指揮或以某人為榜樣，聽從其指揮。", "question": "「馬首是瞻」是什麼意思？", "options": ["看馬的頭", "馬很重要", "騎馬的方向", "比喻跟隨別人的指揮行動"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 69, "chengyu": "口若懸河", "meaning": "形容說話滔滔不絕，口才極好", "story": "說話像懸掛的河水一樣，滔滔不絕地流出來。形容一個人口才非常好，說話流利，能言善道，侃侃而談。", "question": "「口若懸河」是什麼意思？", "options": ["形容說話滔滔不絕，口才極好", "嘴巴像河流", "說話很快", "河水很急"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 70, "chengyu": "天衣無縫", "meaning": "形容事情做得非常完美，找不到任何缺點", "story": "傳說仙女的衣服沒有縫合的痕跡，是天然形成的。比喻事情做得非常完美，毫無破綻，找不到任何缺點或漏洞。", "question": "「天衣無縫」是什麼意思？", "options": ["衣服沒有縫", "形容事情做得非常完美，找不到任何缺點", "天上的衣服", "縫紉技術好"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 71, "chengyu": "水落石出", "meaning": "比喻事情真相終於大白", "story": "水退了，水底的石頭就露出來了。比喻隨著時間推移或調查深入，事情的真相終於完全顯露出來，一切都清楚了。", "question": "「水落石出」是什麼意思？", "options": ["水裡有石頭", "石頭露出水面", "比喻事情真相終於大白", "水位下降"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 72, "chengyu": "一波三折", "meaning": "形容事情進行中多次出現波折和變化", "story": "書法中一橫有三個轉折，形容筆法豐富。後來比喻事情在進行過程中多次出現變化和波折，不順利，曲折複雜。", "question": "「一波三折」是什麼意思？", "options": ["波浪很多", "三次折疊", "書法技巧", "形容事情進行中多次出現波折和變化"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 73, "chengyu": "如魚得水", "meaning": "比喻得到了非常適合自己的環境或機會", "story": "魚在水中才能自由自在地生活。比喻一個人找到了非常適合自己的環境、工作或伴侶，感到非常舒適和如意。", "question": "「如魚得水」是什麼意思？", "options": ["比喻得到了非常適合自己的環境或機會", "魚在水裡", "水裡有魚", "魚很快樂"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 74, "chengyu": "投桃報李", "meaning": "比喻互相贈答，禮尚往來", "story": "出自《詩經》，你送我桃子，我回贈你李子。比喻受到別人的好意或恩惠，要以同等或更好的方式回報，禮尚往來。", "question": "「投桃報李」是什麼意思？", "options": ["送水果", "比喻互相贈答，禮尚往來", "桃子和李子", "水果很好吃"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 75, "chengyu": "聞雞起舞", "meaning": "形容有志之士及時奮發，勤奮努力", "story": "晉代祖逖和劉琨聽到雞叫就起床練劍，立志報效國家。後來比喻有志氣的人及時奮發，勤奮努力，不浪費時間。", "question": "「聞雞起舞」是什麼意思？", "options": ["聽到雞叫就跳舞", "雞叫很好聽", "形容有志之士及時奮發，勤奮努力", "早起的習慣"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "學習"}, {"id": 76, "chengyu": "一字千金", "meaning": "形容文章或詩詞非常精妙，價值極高", "story": "秦相呂不韋編寫《呂氏春秋》，懸賞說能改動一字者賞千金。後來比喻文章寫得極好，每個字都有很高的價值。", "question": "「一字千金」是什麼意思？", "options": ["寫字賺錢", "一個字值一千金", "文字很貴", "形容文章或詩詞非常精妙，價值極高"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "數字"}, {"id": 77, "chengyu": "不恥下問", "meaning": "不以向地位低的人請教為恥", "story": "出自《論語》，孔子說衛國大夫孔圉死後諡號「文」，是因為他聰明好學，不以向地位低的人請教為恥。", "question": "「不恥下問」是什麼意思？", "options": ["不以向地位低的人請教為恥", "不問問題", "問問題很羞恥", "向上級請教"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "學習"}, {"id": 78, "chengyu": "功虧一簣", "meaning": "比喻事情快要成功時，因最後一步的疏忽而失敗", "story": "《尚書》中說，堆九仞高的山，只差最後一筐土就完成了，卻因為放棄而功敗垂成。比喻事情快成功時因疏忽而失敗。", "question": "「功虧一簣」是什麼意思？", "options": ["功勞很大", "比喻事情快要成功時，因最後一步的疏忽而失敗", "一筐土很重要", "堆山的故事"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 79, "chengyu": "名副其實", "meaning": "名稱或名聲與實際情況完全相符", "story": "形容一個人或事物的名稱、名聲與其實際的情況完全相符，不是虛有其名，而是真正名實相符。", "question": "「名副其實」是什麼意思？", "options": ["名字很好聽", "有名氣", "名稱或名聲與實際情況完全相符", "名字和實物一樣"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 80, "chengyu": "因地制宜", "meaning": "根據不同的地方情況，採取適當的措施", "story": "根據不同地方的實際情況，採取相應的措施和方法。強調做事要靈活，不能一刀切，要根據具體情況來決定對策。", "question": "「因地制宜」是什麼意思？", "options": ["在地上制作", "地方很重要", "制度很好", "根據不同的地方情況，採取適當的措施"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 81, "chengyu": "韋編三絕", "meaning": "形容讀書勤奮，反覆鑽研", "story": "孔子晚年喜讀《易經》，反覆閱讀，把穿竹簡的牛皮繩（韋編）都磨斷了三次。後來比喻讀書勤奮，反覆研讀。", "question": "「韋編三絕」是什麼意思？", "options": ["形容讀書勤奮，反覆鑽研", "書的裝訂斷了三次", "三本書的故事", "讀書讀到書壞掉"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 82, "chengyu": "囊螢映雪", "meaning": "形容家境貧寒仍勤奮苦讀", "story": "晉代車胤用袋子裝螢火蟲照明讀書；孫康在雪地的反光下讀書。兩人都因家貧無燈油，卻刻苦讀書，後來都成為著名學者。", "question": "「囊螢映雪」是什麼意思？", "options": ["用螢火蟲照明讀書", "形容家境貧寒仍勤奮苦讀", "雪地裡有螢火蟲", "夜晚讀書的故事"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "學習"}, {"id": 83, "chengyu": "程門立雪", "meaning": "形容尊師重道，虔誠求學", "story": "宋代楊時和游酢去拜訪老師程頤，程頤正在午睡，兩人恭敬地站在門外等候，等程頤醒來，門外積雪已深一尺。", "question": "「程門立雪」是什麼意思？", "options": ["在雪地裡等老師", "雪天上課", "形容尊師重道，虔誠求學", "程老師教書"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 84, "chengyu": "負荊請罪", "meaning": "主動向對方承認錯誤，請求懲罰", "story": "趙國廉頗因嫉妒藺相如，揚言要羞辱他。藺相如以國家大局為重，處處避讓。廉頗知道後，背著荊條去藺相如家請罪，兩人成為刎頸之交。", "question": "「負荊請罪」是什麼意思？", "options": ["荊棘很多", "背著荊條去道歉", "請求原諒", "主動向對方承認錯誤，請求懲罰"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 85, "chengyu": "完璧歸趙", "meaning": "比喻把原物完好地歸還給原主", "story": "趙惠文王得到和氏璧，秦昭王想用十五座城換取。藺相如奉命出使秦國，憑藉智慧和勇氣，完整地把和氏璧帶回趙國。", "question": "「完璧歸趙」是什麼意思？", "options": ["比喻把原物完好地歸還給原主", "趙國的寶玉", "玉璧很完整", "把玉璧送給趙國"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 86, "chengyu": "毛遂自薦", "meaning": "自己推薦自己，主動請纓", "story": "戰國時，趙國使者平原君要選二十人出使楚國，毛遂主動請求隨行。平原君起初不信任他，但毛遂憑藉才能，成功說服楚王出兵救趙。", "question": "「毛遂自薦」是什麼意思？", "options": ["毛遂的故事", "自己推薦自己，主動請纓", "推薦別人", "毛遂很厲害"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 87, "chengyu": "紙上談兵", "meaning": "比喻只會空談理論，缺乏實際能力", "story": "趙括熟讀兵書，談起兵法頭頭是道，但缺乏實戰經驗。長平之戰中，他代替廉頗為將，結果被秦軍大敗，四十萬趙軍被坑殺。", "question": "「紙上談兵」是什麼意思？", "options": ["在紙上畫軍隊", "紙做的士兵", "比喻只會空談理論，缺乏實際能力", "談論戰爭"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 88, "chengyu": "三顧茅廬", "meaning": "比喻誠心誠意地一再邀請或拜訪", "story": "劉備為了請諸葛亮出山輔佐，三次親自前往隆中草廬拜訪。前兩次都沒見到，第三次才見到諸葛亮，感動了他出山相助。", "question": "「三顧茅廬」是什麼意思？", "options": ["去茅草屋三次", "三個人住茅廬", "劉備找諸葛亮", "比喻誠心誠意地一再邀請或拜訪"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 89, "chengyu": "望梅止渴", "meaning": "比喻用空想來安慰自己", "story": "曹操行軍時，士兵口渴難耐。曹操說前面有梅林，士兵一想到梅子的酸味，口水直流，暫時解了渴。比喻用空想來安慰自己。", "question": "「望梅止渴」是什麼意思？", "options": ["比喻用空想來安慰自己", "梅子很酸", "看梅子解渴", "口渴了看梅子"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 90, "chengyu": "高山流水", "meaning": "比喻知音難遇，或形容樂曲高妙", "story": "伯牙善彈琴，鍾子期善聽琴。伯牙彈奏高山，鍾子期說「巍巍乎若泰山」；彈奏流水，說「洋洋乎若江河」。鍾子期死後，伯牙摔琴絕弦。", "question": "「高山流水」是什麼意思？", "options": ["山上有流水", "比喻知音難遇，或形容樂曲高妙", "流水的聲音", "高山的風景"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 91, "chengyu": "鷸蚌相爭", "meaning": "比喻雙方爭持不下，讓第三者得利", "story": "鷸鳥啄蚌，蚌夾住鷸嘴，兩者相持不下。漁翁走來，輕鬆把兩者都捉走了。比喻雙方爭鬥，讓第三者坐收漁利。", "question": "「鷸蚌相爭」是什麼意思？", "options": ["鳥和蚌打架", "漁翁得利", "比喻雙方爭持不下，讓第三者得利", "水鳥的故事"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "動物"}, {"id": 92, "chengyu": "圍魏救趙", "meaning": "比喻避實就虛，攻其要害，迫使對方撤退", "story": "魏國攻打趙國，趙國向齊國求救。孫臏不直接救趙，而是率兵攻打魏國首都，魏軍急忙回救，趙國之圍自然解除。", "question": "「圍魏救趙」是什麼意思？", "options": ["魏國救趙國", "包圍魏國", "戰國的故事", "比喻避實就虛，攻其要害，迫使對方撤退"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 93, "chengyu": "洛陽紙貴", "meaning": "比喻著作廣為流傳，風行一時", "story": "晉代左思寫《三都賦》，花了十年時間，寫成後轟動一時，人們爭相抄寫，導致洛陽的紙張供不應求，價格大漲。", "question": "「洛陽紙貴」是什麼意思？", "options": ["比喻著作廣為流傳，風行一時", "洛陽的紙很貴", "紙張很稀缺", "寫作很費紙"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 94, "chengyu": "一鼓作氣", "meaning": "比喻趁著初起的勇氣和力量，一口氣把事情做完", "story": "《左傳》記載，曹劌論戰時說：「夫戰，勇氣也。一鼓作氣，再而衰，三而竭。」比喻趁著勇氣旺盛時，一口氣完成任務。", "question": "「一鼓作氣」是什麼意思？", "options": ["打鼓一次", "比喻趁著初起的勇氣和力量，一口氣把事情做完", "鼓聲很響", "士氣很高"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "小學生"}, {"id": 95, "chengyu": "退避三舍", "meaning": "比喻對人讓步，不與人相爭", "story": "晉文公重耳流亡時，楚王問他若兩國交戰如何報答，他說退避三舍（九十里）。後來晉楚城濮之戰，晉軍果然先退九十里，再大敗楚軍。", "question": "「退避三舍」是什麼意思？", "options": ["退後三步", "退到三個房間外", "比喻對人讓步，不與人相爭", "逃跑了"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 96, "chengyu": "紙醉金迷", "meaning": "形容奢侈豪華、放蕩享樂的生活", "story": "唐代有人用金紙裝飾房間，燈光照耀下金光閃閃，令人陶醉。後來形容生活極度奢侈，沉迷於豪華享樂之中。", "question": "「紙醉金迷」是什麼意思？", "options": ["紙和金子混在一起", "金紙裝飾的房間", "醉酒的故事", "形容奢侈豪華、放蕩享樂的生活"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 97, "chengyu": "曲突徙薪", "meaning": "比喻事先採取措施，防患於未然", "story": "有人看到鄰居的煙囪太直，柴堆靠近煙囪，勸其改建，主人不聽。後來果然失火，鄰居幫忙救火。比喻防患於未然。", "question": "「曲突徙薪」是什麼意思？", "options": ["比喻事先採取措施，防患於未然", "彎曲的煙囪", "移動柴火", "防火的故事"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 98, "chengyu": "伯樂相馬", "meaning": "比喻善於發現和推薦人才", "story": "伯樂是古代著名的相馬師，能識別千里馬。後來比喻善於發現人才、推薦人才的人，強調識才、愛才的重要性。", "question": "「伯樂相馬」是什麼意思？", "options": ["相馬的技術", "比喻善於發現和推薦人才", "千里馬的故事", "伯樂的職業"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 99, "chengyu": "懸梁刺股", "meaning": "形容刻苦學習，廢寢忘食", "story": "蘇秦讀書困倦時，用錐子刺大腿；孫敬讀書時把頭髮綁在房梁上，防止打瞌睡。兩人都以此激勵自己刻苦讀書。", "question": "「懸梁刺股」是什麼意思？", "options": ["把頭髮綁在梁上", "用錐子刺腿", "形容刻苦學習，廢寢忘食", "讀書很辛苦"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "學習"}, {"id": 100, "chengyu": "一飯千金", "meaning": "比喻受人恩惠，要重重報答", "story": "韓信落魄時，一位洗衣婦每天給他飯吃。韓信成為大將後，找到那位婦人，贈她千金以報答當年的一飯之恩。", "question": "「一飯千金」是什麼意思？", "options": ["一頓飯值千金", "吃飯很貴", "感謝的故事", "比喻受人恩惠，要重重報答"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "小學生"}, {"id": 101, "chengyu": "笑裡藏刀", "meaning": "表面和善，內心陰險", "story": "形容一個人表面上笑臉迎人，看起來和善可親，但內心卻隱藏著陰險的計謀，是一種虛偽危險的人。", "question": "「笑裡藏刀」是什麼意思？", "options": ["表面和善，內心陰險", "刀藏在笑容裡", "笑著拿刀", "危險的笑容"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 102, "chengyu": "四面楚歌", "meaning": "比喻陷入四面受敵、孤立無援的困境", "story": "楚漢相爭末期，項羽被圍於垓下，夜聽四面皆是楚地歌聲，以為楚地已盡歸漢，軍心大亂，最終項羽自刎烏江。", "question": "「四面楚歌」是什麼意思？", "options": ["四面都有歌聲", "比喻陷入四面受敵、孤立無援的困境", "楚國的歌曲", "項羽的故事"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "數字"}, {"id": 103, "chengyu": "一日千里", "meaning": "形容進步或發展非常迅速", "story": "原指馬一天能跑千里，形容速度極快。後來比喻事業、學業或某種情況進步和發展得非常迅速，令人刮目相看。", "question": "「一日千里」是什麼意思？", "options": ["一天走千里路", "馬跑得很快", "形容進步或發展非常迅速", "距離很遠"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "數字"}, {"id": 104, "chengyu": "金玉其外，敗絮其中", "meaning": "比喻外表華美，內裡空虛", "story": "明代劉基《賣柑者言》中，賣橘子的人把橘子裝扮得金光閃閃，但裡面卻是腐爛的棉絮。比喻外表好看，內裡卻很差。", "question": "「金玉其外，敗絮其中」是什麼意思？", "options": ["金玉很貴", "外面有金玉", "裡面很破舊", "比喻外表華美，內裡空虛"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 105, "chengyu": "青出於藍", "meaning": "比喻學生超過老師，後人超過前人", "story": "出自《荀子》，靛青是從藍草中提取的，卻比藍草更藍。比喻學生的成就超過了老師，後輩超越了前輩。", "question": "「青出於藍」是什麼意思？", "options": ["比喻學生超過老師，後人超過前人", "藍色變成青色", "顏色的變化", "染料的故事"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 106, "chengyu": "雪中送炭", "meaning": "在別人最困難的時候給予幫助", "story": "在大雪天氣裡送去炭火，讓受凍的人得到溫暖。比喻在別人最困難、最需要幫助的時候，給予及時的援助。", "question": "「雪中送炭」是什麼意思？", "options": ["下雪天送炭", "在別人最困難的時候給予幫助", "炭火很溫暖", "冬天的故事"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "自然"}, {"id": 107, "chengyu": "錦上添花", "meaning": "比喻在美好的事物上再加上好的東西", "story": "在美麗的錦緞上再繡上花朵，使其更加美麗。比喻在已經很好的基礎上，再加上更好的東西，使之錦上添花。", "question": "「錦上添花」是什麼意思？", "options": ["在布上繡花", "花很漂亮", "比喻在美好的事物上再加上好的東西", "錦緞很貴"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 108, "chengyu": "落井下石", "meaning": "比喻趁人危難時再加以傷害", "story": "一個人掉進井裡，不但不救他，反而向井裡扔石頭。比喻在別人遭遇困難或危難時，不但不幫助，反而趁機加害。", "question": "「落井下石」是什麼意思？", "options": ["掉進井裡", "向井裡扔石頭", "救人的故事", "比喻趁人危難時再加以傷害"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 109, "chengyu": "一事無成", "meaning": "什麼事情都沒有做成功", "story": "形容一個人努力了很久，或者過了很長時間，卻什麼事情都沒有做成功，毫無成就，令人感到失落和沮喪。", "question": "「一事無成」是什麼意思？", "options": ["什麼事情都沒有做成功", "只做了一件事", "做事很失敗", "沒有努力"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "小學生"}, {"id": 110, "chengyu": "人山人海", "meaning": "形容人非常多，擁擠熱鬧", "story": "形容某個地方聚集了非常多的人，就像山一樣高，像海一樣廣，人群密集，非常擁擠熱鬧。", "question": "「人山人海」是什麼意思？", "options": ["山和海都有人", "形容人非常多，擁擠熱鬧", "人在山上和海邊", "很多人聚集"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 111, "chengyu": "馬不停蹄", "meaning": "形容不停地趕路或做事，不休息", "story": "馬蹄不停地奔跑，不停下來休息。形容一個人不停地趕路或持續不斷地工作，沒有任何停歇，非常勤奮努力。", "question": "「馬不停蹄」是什麼意思？", "options": ["馬跑得很快", "馬蹄不停", "形容不停地趕路或做事，不休息", "馬很勤勞"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 112, "chengyu": "一塵不染", "meaning": "形容非常乾淨，或比喻品格高尚純潔", "story": "形容環境非常乾淨，連一粒塵土都沒有。也比喻一個人的品格非常高尚純潔，不受任何不良影響的污染。", "question": "「一塵不染」是什麼意思？", "options": ["沒有灰塵", "打掃很乾淨", "空氣很清新", "形容非常乾淨，或比喻品格高尚純潔"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "品格"}, {"id": 113, "chengyu": "眼高手低", "meaning": "形容要求很高，但實際能力卻很差", "story": "眼睛看得很高，手卻做不到。形容一個人眼光高，理想大，但實際動手能力卻很差，好高騖遠，眼高手低。", "question": "「眼高手低」是什麼意思？", "options": ["形容要求很高，但實際能力卻很差", "眼睛和手的位置", "視力很好", "手藝很差"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 114, "chengyu": "一言九鼎", "meaning": "形容說話有份量，一句話能起很大作用", "story": "九鼎是古代象徵國家政權的重器。一句話有九鼎那麼重，形容說話非常有份量，一言既出，影響重大，不可輕視。", "question": "「一言九鼎」是什麼意思？", "options": ["說了九句話", "形容說話有份量，一句話能起很大作用", "九個鼎很重", "說話很重要"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "小學生"}, {"id": 115, "chengyu": "魚目混珠", "meaning": "比喻以假亂真，以次充好", "story": "用魚的眼睛冒充珍珠。比喻用假的東西冒充真的，以次充好，欺騙他人，讓人難以分辨真假。", "question": "「魚目混珠」是什麼意思？", "options": ["魚眼和珍珠", "珍珠很漂亮", "比喻以假亂真，以次充好", "魚的眼睛"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 116, "chengyu": "一毛不拔", "meaning": "形容人非常吝嗇，一點都不肯付出", "story": "出自《孟子》，楊朱的學說認為即使拔一根毛能使天下得利，也不願意做。後來形容極度吝嗇的人。", "question": "「一毛不拔」是什麼意思？", "options": ["頭髮很多不需要拔", "毛很珍貴", "不願意幫忙", "形容人非常吝嗇，一點都不肯付出"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "小學生"}, {"id": 117, "chengyu": "如虎添翼", "meaning": "比喻強大的人或事物得到了更有力的幫助", "story": "老虎本來已經很厲害，如果再加上翅膀，就更加無敵了。比喻本來已經強大的人或事物，得到了更有力的支持或幫助。", "question": "「如虎添翼」是什麼意思？", "options": ["比喻強大的人或事物得到了更有力的幫助", "老虎長了翅膀", "老虎很厲害", "翅膀很有用"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 118, "chengyu": "一目十行", "meaning": "形容閱讀速度非常快", "story": "一眼能看完十行文字。形容一個人閱讀速度非常快，能夠快速瀏覽和理解大量文字，是形容閱讀能力強的說法。", "question": "「一目十行」是什麼意思？", "options": ["看了十行", "形容閱讀速度非常快", "眼睛很大", "讀書很快"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "小學生"}, {"id": 119, "chengyu": "天長地久", "meaning": "形容時間長久，永遠不變", "story": "出自老子《道德經》，天地存在的時間非常長久。後來比喻感情、友誼或某種關係永久不變，像天地一樣長久。", "question": "「天長地久」是什麼意思？", "options": ["天和地很大", "天地很美麗", "形容時間長久，永遠不變", "長久的故事"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 120, "chengyu": "一知半解", "meaning": "形容對事情了解得不深入，只知道一點點", "story": "形容對某件事情只有一點點了解，沒有深入研究，知識不完整，似懂非懂，容易產生誤解或做出錯誤的判斷。", "question": "「一知半解」是什麼意思？", "options": ["知道一半", "了解很多", "半知半解", "形容對事情了解得不深入，只知道一點點"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "小學生"}, {"id": 121, "chengyu": "狗急跳牆", "meaning": "比喻走投無路時，不顧一切地採取行動", "story": "狗被逼急了，連牆都能跳過去。比喻一個人在走投無路、極度絕望的情況下，不顧一切地採取極端行動。", "question": "「狗急跳牆」是什麼意思？", "options": ["比喻走投無路時，不顧一切地採取行動", "狗很會跳", "狗跳過了牆", "被逼急了"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "動物"}, {"id": 122, "chengyu": "馬革裹屍", "meaning": "形容英勇殺敵，戰死沙場的精神", "story": "東漢馬援說：「男兒要當死於邊野，以馬革裹屍還葬耳。」形容軍人英勇殺敵，戰死沙場，馬皮包裹屍體而歸的壯烈精神。", "question": "「馬革裹屍」是什麼意思？", "options": ["用馬皮包裹", "形容英勇殺敵，戰死沙場的精神", "馬的皮革", "戰場的故事"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 123, "chengyu": "一箭之遙", "meaning": "形容距離不遠，大約一箭射程的距離", "story": "古代以箭的射程來估計距離，一箭之遙大約是一百到三百步。現在比喻距離不太遠，很快就能到達的地方。", "question": "「一箭之遙」是什麼意思？", "options": ["射箭的距離", "箭射得很遠", "形容距離不遠，大約一箭射程的距離", "距離很近"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 124, "chengyu": "人盡其才", "meaning": "讓每個人的才能都得到充分發揮", "story": "讓每個人的才能都能夠得到充分的發揮和利用，不浪費任何人才。是管理者應該追求的理想狀態。", "question": "「人盡其才」是什麼意思？", "options": ["人才很多", "才能很重要", "人才的故事", "讓每個人的才能都得到充分發揮"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 125, "chengyu": "物盡其用", "meaning": "讓每樣東西都得到充分的利用，不浪費", "story": "讓每一樣物品都能夠得到最充分的利用，發揮其最大的價值，不造成任何浪費。是節約精神的體現。", "question": "「物盡其用」是什麼意思？", "options": ["讓每樣東西都得到充分的利用，不浪費", "東西很多", "物品的用途", "節約的故事"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 126, "chengyu": "一觸即發", "meaning": "形容形勢緊張，隨時可能爆發", "story": "形容局勢非常緊張，就像一根引線，只要輕輕一碰就會立即爆發。比喻危機或衝突隨時可能爆發的緊張狀態。", "question": "「一觸即發」是什麼意思？", "options": ["碰一下就爆炸", "形容形勢緊張，隨時可能爆發", "觸電的危險", "緊張的情況"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 127, "chengyu": "欲速則不達", "meaning": "過於急於求成，反而達不到目的", "story": "出自《論語》，孔子說做事太急於求成，反而達不到目的。強調做事要循序漸進，不能急躁，否則欲速則不達。", "question": "「欲速則不達」是什麼意思？", "options": ["速度很快", "不能太快", "過於急於求成，反而達不到目的", "目的很遠"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 128, "chengyu": "知己知彼", "meaning": "了解自己也了解對方，才能取得勝利", "story": "出自孫子兵法，「知己知彼，百戰不殆」。了解自己的優缺點，也了解對方的情況，才能在競爭中立於不敗之地。", "question": "「知己知彼」是什麼意思？", "options": ["認識自己和朋友", "知道很多", "了解對手", "了解自己也了解對方，才能取得勝利"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 129, "chengyu": "一石激起千層浪", "meaning": "比喻一件小事引起了很大的反響", "story": "把一塊石頭投入平靜的水面，會激起一圈圈向外擴散的波浪。比喻一件看似普通的事情，卻引起了廣泛的關注和強烈的反應。", "question": "「一石激起千層浪」是什麼意思？", "options": ["比喻一件小事引起了很大的反響", "石頭投入水中", "水波很多", "石頭很重"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 130, "chengyu": "半斤八兩", "meaning": "比喻兩者差不多，不相上下", "story": "舊制一斤等於十六兩，半斤就是八兩，兩者完全相等。比喻兩個人或兩件事情差不多，彼此不相上下，難分高下。", "question": "「半斤八兩」是什麼意思？", "options": ["重量的計算", "比喻兩者差不多，不相上下", "半斤和八兩", "稱重的故事"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 131, "chengyu": "一箭雙鵰", "meaning": "一個行動達到兩個目的", "story": "北周時期，長孫晟射箭，一箭射穿兩隻大雕。後來比喻一個行動同時達到兩個目的，效率極高。", "question": "「一箭雙鵰」是什麼意思？", "options": ["射箭技術很好", "射中兩隻鳥", "一個行動達到兩個目的", "箭法精準"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "動物"}, {"id": 132, "chengyu": "以以以以", "meaning": "測試題目", "story": "這是一個測試。", "question": "「唇亡齒寒」是什麼意思？", "options": ["比喻關係密切，一方受損，另一方也受影響", "嘴唇和牙齒的關係", "嘴唇很重要", "牙齒很冷"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 133, "chengyu": "唇亡齒寒", "meaning": "比喻關係密切，一方受損，另一方也受影響", "story": "嘴唇沒有了，牙齒就會感到寒冷。比喻兩者關係非常密切，互相依存，一方遭受損失，另一方也必然受到影響。", "question": "「唇亡齒寒」是什麼意思？", "options": ["嘴唇和牙齒的關係", "嘴唇很重要", "牙齒很冷", "比喻關係密切，一方受損，另一方也受影響"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 134, "chengyu": "同舟共濟", "meaning": "比喻在困難時互相幫助，共同渡過難關", "story": "出自《孫子兵法》，坐在同一條船上，遇到風浪要互相幫助。比喻在困難或危險的時候，大家齊心協力，共同渡過難關。", "question": "「同舟共濟」是什麼意思？", "options": ["坐同一條船", "比喻在困難時互相幫助，共同渡過難關", "一起渡河", "船上的故事"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 135, "chengyu": "一呼百應", "meaning": "一個人號召，很多人響應", "story": "一個人發出號召，立刻有很多人響應。形容一個人有很高的威望或號召力，能夠得到眾多人的支持和響應。", "question": "「一呼百應」是什麼意思？", "options": ["叫了一聲", "百人齊呼", "一個人號召，很多人響應", "號召力很強"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 136, "chengyu": "千鈞一髮", "meaning": "比喻情況非常危急，危在旦夕", "story": "用千鈞（極重的重量）的東西懸掛在一根頭髮上，隨時可能斷裂。比喻局勢極其危急，危險就在眼前，隨時可能發生最壞的結果。", "question": "「千鈞一髮」是什麼意思？", "options": ["頭髮很重要", "一根頭髮", "重量很大", "比喻情況非常危急，危在旦夕"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "數字"}, {"id": 137, "chengyu": "一敗塗地", "meaning": "形容失敗得非常慘，無法挽回", "story": "形容失敗得非常徹底，就像泥土塗滿了地面一樣，一塌糊塗，無法收拾，完全沒有挽回的餘地。", "question": "「一敗塗地」是什麼意思？", "options": ["形容失敗得非常慘，無法挽回", "塗了地板", "敗了一次", "地上很髒"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 138, "chengyu": "見縫插針", "meaning": "比喻善於利用一切機會或空隙", "story": "看到縫隙就插入針，形容善於利用一切可以利用的機會和空隙，不放過任何機會，非常靈活機智。", "question": "「見縫插針」是什麼意思？", "options": ["縫衣服", "比喻善於利用一切機會或空隙", "插針的技術", "縫隙很小"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 139, "chengyu": "捨本逐末", "meaning": "比喻放棄根本，追求次要的東西", "story": "放棄根本重要的事情，去追求次要的、表面的東西。比喻做事情主次不分，不抓住關鍵，反而在細枝末節上花費精力。", "question": "「捨本逐末」是什麼意思？", "options": ["放棄了根本", "追求末尾", "比喻放棄根本，追求次要的東西", "本末倒置"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 140, "chengyu": "一往無前", "meaning": "形容勇往直前，毫不退縮", "story": "形容一個人勇敢地向前進，不畏艱難，不退縮，一直向前衝，有著堅定的意志和無畏的勇氣。", "question": "「一往無前」是什麼意思？", "options": ["一直向前走", "沒有前方", "勇敢的人", "形容勇往直前，毫不退縮"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "小學生"}, {"id": 141, "chengyu": "臨渴掘井", "meaning": "比喻事到臨頭才想辦法，為時已晚", "story": "口渴了才去挖井，當然來不及。比喻事情到了緊急關頭才想到要準備，為時已晚，強調凡事要未雨綢繆，事先準備。", "question": "「臨渴掘井」是什麼意思？", "options": ["比喻事到臨頭才想辦法，為時已晚", "口渴了挖井", "挖井找水", "準備不足"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 142, "chengyu": "鞠躬盡瘁", "meaning": "形容盡心盡力，不惜犧牲自己", "story": "諸葛亮在《出師表》中說「鞠躬盡瘁，死而後已」，形容他為蜀漢盡心盡力，直到死去為止。後來比喻為某事業竭盡全力。", "question": "「鞠躬盡瘁」是什麼意思？", "options": ["鞠躬很多次", "形容盡心盡力，不惜犧牲自己", "諸葛亮的故事", "死而後已"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 143, "chengyu": "臥龍鳳雛", "meaning": "比喻傑出的人才", "story": "諸葛亮被稱為「臥龍」，龐統被稱為「鳳雛」，兩人都是三國時期的傑出謀士。後來比喻才能出眾的傑出人才。", "question": "「臥龍鳳雛」是什麼意思？", "options": ["龍和鳳凰", "諸葛亮和龐統", "比喻傑出的人才", "動物的名字"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 144, "chengyu": "孺子可教", "meaning": "形容年輕人有培養前途，值得教導", "story": "《史記》中，張良年輕時，黃石公三次讓他撿鞋，他都恭敬地照做。黃石公說「孺子可教矣」，後來傳授他兵書。", "question": "「孺子可教」是什麼意思？", "options": ["小孩子要教育", "教育很重要", "張良的故事", "形容年輕人有培養前途，值得教導"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 145, "chengyu": "一諾千金", "meaning": "形容說話算數，承諾非常可靠", "story": "秦末有個叫季布的人，說話算數，凡是答應的事情一定做到。當時流傳「得黃金百斤，不如得季布一諾」的說法。", "question": "「一諾千金」是什麼意思？", "options": ["形容說話算數，承諾非常可靠", "一個承諾值千金", "金錢很重要", "諾言很貴"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "數字"}, {"id": 146, "chengyu": "風聲鶴唳", "meaning": "形容驚慌失措，疑神疑鬼", "story": "東晉淝水之戰，秦軍大敗，逃跑時聽到風聲和鶴叫聲，都以為是追兵，驚慌失措。後來比喻驚慌恐懼，疑神疑鬼。", "question": "「風聲鶴唳」是什麼意思？", "options": ["風和鶴的聲音", "形容驚慌失措，疑神疑鬼", "鶴叫聲很響", "戰場的故事"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 147, "chengyu": "草木皆兵", "meaning": "形容極度恐慌，把一切都看作是敵人", "story": "東晉淝水之戰，苻堅登上壽陽城，看到對面的草木都像是晉軍，極度恐慌。後來比喻在驚慌中把一切都看作威脅。", "question": "「草木皆兵」是什麼意思？", "options": ["草和木頭", "士兵藏在草叢中", "形容極度恐慌，把一切都看作是敵人", "草木很多"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 148, "chengyu": "投鞭斷流", "meaning": "比喻軍隊人數眾多，力量強大", "story": "前秦苻堅說他的軍隊如此之多，把馬鞭投入江中就能截斷水流。後來比喻兵力強大，人數眾多，氣勢磅礴。", "question": "「投鞭斷流」是什麼意思？", "options": ["鞭子投入水中", "截斷河流", "馬鞭很長", "比喻軍隊人數眾多，力量強大"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 149, "chengyu": "暗度陳倉", "meaning": "比喻用假象迷惑對方，暗中採取行動", "story": "劉邦明修棧道，暗度陳倉，表面上修復棧道迷惑項羽，實際上卻從陳倉小道偷渡，出其不意地攻佔了關中。", "question": "「暗度陳倉」是什麼意思？", "options": ["比喻用假象迷惑對方，暗中採取行動", "暗中行動", "陳倉的故事", "劉邦的計謀"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 150, "chengyu": "背水一戰", "meaning": "比喻在絕境中拼死一搏", "story": "韓信率軍背水列陣，士兵無路可退，只能拼死作戰，最終大敗趙軍。後來比喻在絕境中，以置之死地而後生的精神拼死一搏。", "question": "「背水一戰」是什麼意思？", "options": ["在水邊打仗", "比喻在絕境中拼死一搏", "韓信的故事", "背對著水"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 151, "chengyu": "運籌帷幄", "meaning": "形容在後方謀劃指揮，決勝於千里之外", "story": "劉邦說張良能「運籌帷幄之中，決勝千里之外」，形容張良在帷幄（軍帳）中謀劃，就能決定千里之外的勝負。", "question": "「運籌帷幄」是什麼意思？", "options": ["在帳篷裡計劃", "張良的故事", "形容在後方謀劃指揮，決勝於千里之外", "謀略很重要"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 152, "chengyu": "約法三章", "meaning": "比喻訂立簡單明確的規定", "story": "劉邦進入咸陽後，與百姓約法三章：殺人者死，傷人及盜抵罪。後來比喻訂立簡單明確的規定，讓大家遵守。", "question": "「約法三章」是什麼意思？", "options": ["三條法律", "劉邦的故事", "約定三件事", "比喻訂立簡單明確的規定"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 153, "chengyu": "項莊舞劍", "meaning": "比喻說話或行動的真實目的另有所指", "story": "鴻門宴上，項莊以舞劍助興為名，實際上是要趁機刺殺劉邦。范增說「項莊舞劍，意在沛公」，後來比喻醉翁之意不在酒。", "question": "「項莊舞劍」是什麼意思？", "options": ["比喻說話或行動的真實目的另有所指", "項莊的劍術", "鴻門宴的故事", "舞劍助興"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 154, "chengyu": "四面楚歌", "meaning": "比喻陷入四面受敵、孤立無援的困境", "story": "楚漢相爭末期，項羽被圍於垓下，夜聽四面皆是楚地歌聲，以為楚地已盡歸漢，軍心大亂，最終項羽自刎烏江。", "question": "「四面楚歌」是什麼意思？", "options": ["四面都有歌聲", "比喻陷入四面受敵、孤立無援的困境", "楚國的歌曲很好聽", "項羽很傷心"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "數字"}, {"id": 155, "chengyu": "臥薪嘗膽", "meaning": "形容刻苦自勵，發憤圖強", "story": "越王勾踐被吳王夫差打敗後，睡在柴草上，每天嘗一口苦膽，提醒自己不忘恥辱，最終發憤圖強，滅掉了吳國。", "question": "下列哪個成語形容「刻苦自勵，發憤圖強」？", "options": ["高枕無憂", "安居樂業", "臥薪嘗膽", "無憂無慮"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 156, "chengyu": "紙上談兵", "meaning": "比喻只會空談理論，缺乏實際能力", "story": "趙括熟讀兵書，談起兵法頭頭是道，但缺乏實戰經驗。長平之戰中，他代替廉頗為將，結果被秦軍大敗，四十萬趙軍被坑殺。", "question": "「紙上談兵」的主角是誰？", "options": ["孫臏", "韓信", "廉頗", "趙括"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 157, "chengyu": "一鼓作氣", "meaning": "比喻趁著初起的勇氣和力量，一口氣把事情做完", "story": "《左傳》記載，曹劌論戰時說：「夫戰，勇氣也。一鼓作氣，再而衰，三而竭。」比喻趁著勇氣旺盛時，一口氣完成任務。", "question": "「一鼓作氣」出自哪部典籍？", "options": ["《左傳》", "《史記》", "《孫子兵法》", "《論語》"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "小學生"}, {"id": 158, "chengyu": "負荊請罪", "meaning": "主動向對方承認錯誤，請求懲罰", "story": "趙國廉頗因嫉妒藺相如，揚言要羞辱他。藺相如以國家大局為重，處處避讓。廉頗知道後，背著荊條去藺相如家請罪，兩人成為刎頸之交。", "question": "「負荊請罪」故事中，廉頗去向誰請罪？", "options": ["趙王", "藺相如", "平原君", "趙括"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 159, "chengyu": "完璧歸趙", "meaning": "比喻把原物完好地歸還給原主", "story": "趙惠文王得到和氏璧，秦昭王想用十五座城換取。藺相如奉命出使秦國，憑藉智慧和勇氣，完整地把和氏璧帶回趙國。", "question": "「完璧歸趙」中，藺相如帶回的寶物叫什麼？", "options": ["夜明珠", "傳國玉璽", "和氏璧", "藍田玉"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 160, "chengyu": "三顧茅廬", "meaning": "比喻誠心誠意地一再邀請或拜訪", "story": "劉備為了請諸葛亮出山輔佐，三次親自前往隆中草廬拜訪。前兩次都沒見到，第三次才見到諸葛亮，感動了他出山相助。", "question": "「三顧茅廬」中，劉備去拜訪的是誰？", "options": ["龐統", "周瑜", "司馬懿", "諸葛亮"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 161, "chengyu": "一諾千金", "meaning": "形容說話算數，承諾非常可靠", "story": "秦末有個叫季布的人，說話算數，凡是答應的事情一定做到。當時流傳「得黃金百斤，不如得季布一諾」的說法。", "question": "下列哪個成語形容「說話算數，承諾可靠」？", "options": ["一諾千金", "言而無信", "口是心非", "言過其實"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "數字"}, {"id": 162, "chengyu": "滴水穿石", "meaning": "比喻堅持不懈，終能成功", "story": "水滴雖小，但長期不斷地滴在石頭上，最終能把石頭穿透。比喻只要有恆心，持之以恆，再難的事情也能成功。", "question": "「滴水穿石」是什麼意思？", "options": ["水很厲害", "比喻堅持不懈，終能成功", "石頭有洞", "水滴很多"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "自然"}, {"id": 163, "chengyu": "功成名就", "meaning": "形容事業成功，名聲顯赫", "story": "形容一個人經過努力奮鬥，終於取得了事業上的成功，同時也獲得了很高的名聲和地位，是人生的一大成就。", "question": "「功成名就」是什麼意思？", "options": ["功勞很大", "名字很有名", "形容事業成功，名聲顯赫", "成功的故事"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 164, "chengyu": "精益求精", "meaning": "已經很好了，還要求更好", "story": "出自《論語》，形容一個人對自己的要求非常高，即使已經做得很好了，還是不滿足，繼續追求更高的水準和更完美的結果。", "question": "「精益求精」是什麼意思？", "options": ["精神很好", "求學精神", "精益的意思", "已經很好了，還要求更好"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 165, "chengyu": "開門見山", "meaning": "說話或寫文章直接切入主題，不拐彎抹角", "story": "形容一打開門就能看到山，比喻說話或寫文章開門見山，直接說明主題，不繞圈子，讓人一目了然。", "question": "「開門見山」是什麼意思？", "options": ["直接切入主題，不拐彎抹角", "門外有山景", "登山的入口", "開門就看到山"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 166, "chengyu": "一鳴驚人", "meaning": "平時默默無聞，突然做出驚人之舉", "story": "出自《史記》，楚莊王三年不發號施令，大臣問他，他說：此鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人。後比喻平時沉默，突然有驚人表現。", "question": "「一鳴驚人」是什麼意思？", "options": ["鳥叫聲很大", "平時默默無聞，突然做出驚人之舉", "突然大叫嚇人", "一隻鳥的故事"], "answer": 1, "difficulty": "easy", "stars": 1, "category": "動物"}, {"id": 167, "chengyu": "三人行必有我師", "meaning": "在一起的人中，必定有值得學習的人", "story": "出自《論語》，孔子說：三人行，必有我師焉。意思是與人相處，必定能找到值得學習的地方，提醒人要謙虛好學。", "question": "「三人行必有我師」是什麼意思？", "options": ["三個人一起走路", "老師帶三個學生", "在一起的人中，必定有值得學習的人", "三人行的故事"], "answer": 2, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 168, "chengyu": "知己知彼", "meaning": "了解自己也了解對方，才能百戰百勝", "story": "出自《孫子兵法》，孫子說：知己知彼，百戰不殆。意思是了解自己的實力，也了解對手的情況，才能在競爭中立於不敗之地。", "question": "「知己知彼」是什麼意思？", "options": ["認識朋友", "知道自己的名字", "知道彼此的秘密", "了解自己也了解對方，才能百戰百勝"], "answer": 3, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 169, "chengyu": "有備無患", "meaning": "事先有準備，就不會有憂患", "story": "出自《左傳》，意思是凡事提前做好準備，就能防患於未然，避免日後出現問題和麻煩，是一種未雨綢繆的智慧。", "question": "「有備無患」是什麼意思？", "options": ["事先有準備，就不會有憂患", "有準備的人", "備用物品", "患難與共"], "answer": 0, "difficulty": "easy", "stars": 1, "category": "其他"}, {"id": 170, "chengyu": "因材施教", "meaning": "根據每個人的特點和能力，採用不同的教育方法", "story": "出自《論語》，孔子對不同學生給予不同的教導，根據每個人的性格和能力因材施教，是教育的最高境界。", "question": "「因材施教」是什麼意思？", "options": ["因為材料而教學", "根據每個人的特點採用不同教育方法", "教材很重要", "施工教育"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 171, "chengyu": "推陳出新", "meaning": "去除舊的，創造新的，不斷創新", "story": "比喻在繼承舊有事物的基礎上，去除其中陳舊過時的部分，創造出新的、更好的東西，是創新精神的體現。", "question": "「推陳出新」是什麼意思？", "options": ["推出新產品", "陳舊的東西", "去除舊的，創造新的，不斷創新", "新舊交替"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 172, "chengyu": "見賢思齊", "meaning": "看到有德行的人，就想向他學習看齊", "story": "出自《論語》，孔子說：見賢思齊焉，見不賢而內自省也。意思是看到品德高尚的人，就要向他學習；看到品德不好的人，就要反省自己。", "question": "「見賢思齊」是什麼意思？", "options": ["看到賢人很羨慕", "賢人的故事", "思念賢人", "看到有德行的人，就想向他學習看齊"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 173, "chengyu": "循序漸進", "meaning": "按照一定的步驟，逐漸深入或提高", "story": "形容學習或做事情要按照一定的順序，一步一步地進行，不能急於求成，要循序漸進，才能穩紮穩打地達到目標。", "question": "「循序漸進」是什麼意思？", "options": ["按照一定的步驟，逐漸深入或提高", "循環的順序", "漸漸進步", "按序排列"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "學習"}, {"id": 174, "chengyu": "事半功倍", "meaning": "花費較少的力氣，卻能取得更大的成效", "story": "出自《孟子》，意思是用一半的力氣，卻能得到雙倍的效果，形容做事方法得當，效率極高，事半功倍。", "question": "「事半功倍」是什麼意思？", "options": ["做一半的事", "花費較少的力氣，卻能取得更大的成效", "功勞加倍", "事情很多"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 175, "chengyu": "不恥下問", "meaning": "不以向地位低的人請教為恥，形容謙虛好學", "story": "出自《論語》，孔子稱讚衛國大夫孔圉不以向地位比自己低的人請教為恥，這種謙虛好學的精神值得稱讚。", "question": "「不恥下問」是什麼意思？", "options": ["不問問題", "向下面的人問路", "不以向地位低的人請教為恥，形容謙虛好學", "問問題很丟臉"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "學習"}, {"id": 176, "chengyu": "胸有成竹", "meaning": "做事之前已有充分的計劃和把握", "story": "宋代畫家文同畫竹子前，心中已有完整的竹子形象，所以畫出來非常生動。後比喻做事前已有充分準備和把握，成竹在胸。", "question": "「胸有成竹」是什麼意思？", "options": ["胸口有竹子", "種竹子的計劃", "竹子長在胸前", "做事之前已有充分的計劃和把握"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 177, "chengyu": "一箭雙鵰", "meaning": "一個行動同時達到兩個目的", "story": "北周名將長孫晟善射箭，一次兩隻鵰在空中爭肉，他一箭射穿兩隻鵰，後比喻一個行動同時達到兩個目的，與一石二鳥意思相近。", "question": "「一箭雙鵰」是什麼意思？", "options": ["一個行動同時達到兩個目的", "射箭比賽", "兩隻鵰的故事", "箭術高超"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "動物"}, {"id": 178, "chengyu": "望梅止渴", "meaning": "比喻用空想來安慰自己", "story": "三國時，曹操帶兵行軍，士兵口渴難耐，曹操謊稱前方有梅林，士兵想到梅子的酸味，口水直流，暫時解渴。後比喻用空想來安慰自己。", "question": "「望梅止渴」是什麼意思？", "options": ["看到梅花很渴", "比喻用空想來安慰自己", "梅子能止渴", "望著梅樹"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 179, "chengyu": "狐假虎威", "meaning": "借助別人的威勢來嚇唬人", "story": "狐狸借老虎的威勢嚇唬百獸，百獸見到老虎都逃跑，狐狸以為是怕自己。後比喻仗著有權有勢的人撐腰，欺壓別人。", "question": "「狐假虎威」是什麼意思？", "options": ["狐狸假裝是老虎", "老虎和狐狸是朋友", "借助別人的威勢來嚇唬人", "狐狸很厲害"], "answer": 2, "difficulty": "medium", "stars": 2, "category": "動物"}, {"id": 180, "chengyu": "掩耳盜鈴", "meaning": "自己欺騙自己，以為別人不知道", "story": "有人想偷一口大鐘，但鐘太重搬不走，便用錘子敲碎，鐘聲大響，他捂住自己的耳朵，以為別人也聽不到。後比喻自欺欺人。", "question": "「掩耳盜鈴」是什麼意思？", "options": ["偷鈴鐺的故事", "捂住耳朵", "盜賊的故事", "自己欺騙自己，以為別人不知道"], "answer": 3, "difficulty": "medium", "stars": 2, "category": "生活"}, {"id": 181, "chengyu": "班門弄斧", "meaning": "在行家面前賣弄本領，不自量力", "story": "魯班是古代著名木匠，在魯班門前耍弄斧頭，比喻在行家面前賣弄自己的本領，不知天高地厚，不自量力。", "question": "「班門弄斧」是什麼意思？", "options": ["在行家面前賣弄本領，不自量力", "木匠的工具", "班級的門", "弄壞了斧頭"], "answer": 0, "difficulty": "medium", "stars": 2, "category": "其他"}, {"id": 182, "chengyu": "對牛彈琴", "meaning": "比喻對不懂的人講道理，白費口舌", "story": "古代音樂家公明儀對著牛彈奏高雅的音樂，牛不理不睬，繼續吃草。後比喻對不懂的人講道理或說高深的話，完全是白費力氣。", "question": "「對牛彈琴」是什麼意思？", "options": ["給牛聽音樂", "比喻對不懂的人講道理，白費口舌", "牛喜歡音樂", "彈琴給動物聽"], "answer": 1, "difficulty": "medium", "stars": 2, "category": "動物"}, {"id": 183, "chengyu": "破釜沉舟", "meaning": "比喻下定決心，不留退路，奮力一搏", "story": "楚漢相爭時，項羽渡河後命令士兵砸破鍋，鑿沉船，斷絕退路，以示決一死戰的決心，最終大敗秦軍。後比喻下定決心，不留退路。", "question": "「破釜沉舟」是什麼意思？", "options": ["破壞船隻", "沉船的故事", "比喻下定決心，不留退路，奮力一搏", "打破鍋子"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 184, "chengyu": "曲高和寡", "meaning": "比喻作品或言論高深，能理解的人很少", "story": "宋玉在《對楚王問》中說，唱高雅的歌曲，能跟著唱的人很少。後比喻作品或言論過於高深，能欣賞或理解的人寥寥無幾。", "question": "「曲高和寡」是什麼意思？", "options": ["音樂很高亢", "寡婦的歌曲", "高山上的音樂", "比喻作品或言論高深，能理解的人很少"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 185, "chengyu": "緣木求魚", "meaning": "比喻方法不對，根本達不到目的", "story": "出自《孟子》，爬到樹上去找魚，比喻方向或方法完全錯誤，無論怎麼努力都達不到目的，是徒勞無功的行為。", "question": "「緣木求魚」是什麼意思？", "options": ["比喻方法不對，根本達不到目的", "在樹上釣魚", "找魚的方法", "木頭做的魚"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 186, "chengyu": "杯弓蛇影", "meaning": "比喻疑神疑鬼，自己嚇自己", "story": "晉朝樂廣請客，客人在杯中看到蛇影（其實是牆上弓的倒影），以為喝下了蛇，回家後生病了。後比喻因誤解而產生恐懼，疑神疑鬼。", "question": "「杯弓蛇影」是什麼意思？", "options": ["杯子裡有蛇", "比喻疑神疑鬼，自己嚇自己", "弓箭的影子", "蛇在杯子旁邊"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 187, "chengyu": "鄭人買履", "meaning": "比喻固執拘泥，不知變通", "story": "鄭國有人買鞋，量好尺碼卻忘帶，回家取尺碼時集市已散，他說寧可相信尺碼也不相信自己的腳。後比喻固執拘泥，不懂靈活變通。", "question": "「鄭人買履」是什麼意思？", "options": ["鄭國人買鞋的故事", "買鞋的方法", "比喻固執拘泥，不知變通", "履行承諾"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 188, "chengyu": "刻舟求劍", "meaning": "比喻拘泥固執，不知隨情況變化而變通", "story": "楚人過江時劍掉入水中，他在船邊刻記號，說劍是從這裡掉的，等船停後再下水找，結果當然找不到。後比喻拘泥固執，不懂變通。", "question": "「刻舟求劍」是什麼意思？", "options": ["在船上刻字", "找劍的故事", "刻字求人", "比喻拘泥固執，不知隨情況變化而變通"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 189, "chengyu": "南轅北轍", "meaning": "比喻行動與目標完全相反", "story": "戰國時，有人要去南方的楚國，卻駕車向北走，別人告訴他方向錯了，他說馬好、路費多、車夫技術好，結果越走越遠。後比喻行動與目標背道而馳。", "question": "「南轅北轍」是什麼意思？", "options": ["比喻行動與目標完全相反", "南北方向", "轅和轍的故事", "走錯方向"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 190, "chengyu": "買櫝還珠", "meaning": "比喻取捨不當，捨本逐末", "story": "楚國人用精美的盒子裝珍珠賣給鄭國人，鄭國人買了盒子，把珍珠還給楚人。後比喻只注重外表，忽略了真正有價值的東西，取捨不當。", "question": "「買櫝還珠」是什麼意思？", "options": ["買了盒子", "比喻取捨不當，捨本逐末", "珍珠的故事", "買東西還價"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 191, "chengyu": "塞翁失馬", "meaning": "比喻禍福相互轉化，壞事可能變成好事", "story": "塞翁的馬跑掉了，鄰人安慰他，他說未必是壞事。後來馬帶回一群野馬，兒子騎馬摔斷腿，卻因此免於征兵。後比喻禍福難料，壞事可能變好事。", "question": "「塞翁失馬」是什麼意思？", "options": ["老人失去了馬", "馬跑掉的故事", "比喻禍福相互轉化，壞事可能變成好事", "塞外的老翁"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 192, "chengyu": "葉公好龍", "meaning": "比喻表面喜歡，實際上並不真正喜歡", "story": "葉公非常喜歡龍，家中到處都是龍的圖案，天上的真龍聽說後下凡拜訪，葉公卻嚇得逃跑。後比喻表面喜歡，實際上並不真正喜歡。", "question": "「葉公好龍」是什麼意思？", "options": ["葉公喜歡龍", "龍的故事", "好龍的人", "比喻表面喜歡，實際上並不真正喜歡"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "動物"}, {"id": 193, "chengyu": "邯鄲學步", "meaning": "比喻模仿別人不成，反而失去自己原有的本領", "story": "燕國人去邯鄲學走路的姿勢，不但沒學會，連自己原來的走法也忘了，只好爬著回家。後比喻盲目模仿，反而失去自己的特點。", "question": "「邯鄲學步」是什麼意思？", "options": ["比喻模仿別人不成，反而失去自己原有的本領", "去邯鄲學走路", "學習步法", "邯鄲的故事"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 194, "chengyu": "濫竽充數", "meaning": "比喻沒有真才實學，混在其中充數", "story": "齊宣王喜歡聽三百人合奏竽，南郭先生不會吹竽，卻混在其中充數。後來齊湣王改為一人獨奏，南郭先生只好逃走。後比喻沒有真本領卻混在其中。", "question": "「濫竽充數」是什麼意思？", "options": ["竽的演奏", "比喻沒有真才實學，混在其中充數", "充數的故事", "濫用樂器"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 195, "chengyu": "揠苗助長", "meaning": "比喻急於求成，反而壞事", "story": "宋國農夫嫌禾苗長得太慢，把禾苗一棵棵往上拔，以為這樣能幫助它們生長，結果禾苗全部枯死。後比喻急於求成，違反規律，反而壞事。", "question": "「揠苗助長」是什麼意思？", "options": ["幫助禾苗生長", "拔苗的故事", "比喻急於求成，反而壞事", "農夫的故事"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 196, "chengyu": "程門立雪", "meaning": "比喻尊師重道，誠心求學", "story": "宋代楊時去拜訪老師程頤，程頤正在午睡，楊時不敢打擾，在門外雪中站立等候，等程頤醒來，門外積雪已深。後比喻尊師重道，誠心求學。", "question": "「程門立雪」是什麼意思？", "options": ["在雪中站立", "程老師的故事", "門口下雪", "比喻尊師重道，誠心求學"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 197, "chengyu": "螳螂捕蟬", "meaning": "比喻只顧眼前利益，不知身後有危險", "story": "螳螂正要捕蟬，不知黃雀在後面等著吃它。後比喻只顧眼前的利益，卻不知道身後還有更大的危險在等著，是目光短淺的表現。", "question": "「螳螂捕蟬」是什麼意思？", "options": ["比喻只顧眼前利益，不知身後有危險", "螳螂抓蟬的故事", "蟬的天敵", "螳螂的習性"], "answer": 0, "difficulty": "hard", "stars": 3, "category": "動物"}, {"id": 198, "chengyu": "一葉障目", "meaning": "比喻被局部現象所迷惑，看不到全局", "story": "有人聽說螳螂用樹葉遮住自己捕蟬，便拿樹葉遮住眼睛，以為別人看不到他，結果被人嘲笑。後比喻被局部現象遮蔽，看不到整體真相。", "question": "「一葉障目」是什麼意思？", "options": ["一片葉子", "比喻被局部現象所迷惑，看不到全局", "葉子擋住了眼睛", "障礙物"], "answer": 1, "difficulty": "hard", "stars": 3, "category": "小學生"}, {"id": 199, "chengyu": "東施效顰", "meaning": "比喻不知自己的條件，盲目模仿，反而更醜", "story": "西施因病皺眉，顯得更美，東施見了也學她皺眉，結果更加難看，鄰居都躲避她。後比喻不顧自身條件，盲目模仿他人，反而弄巧成拙。", "question": "「東施效顰」是什麼意思？", "options": ["東施的故事", "學習別人的表情", "比喻不知自己的條件，盲目模仿，反而更醜", "效仿西施"], "answer": 2, "difficulty": "hard", "stars": 3, "category": "其他"}, {"id": 200, "chengyu": "愚公移山", "meaning": "比喻有恆心、有毅力，堅持不懈地克服困難", "story": "愚公家門前有兩座大山，他決心把山移走，子孫後代一起挖山，感動了天帝，天帝派神仙把山移走了。後比喻只要有恆心毅力，再大的困難也能克服。", "question": "「愚公移山」是什麼意思？", "options": ["搬山的故事", "愚蠢的老人", "山很大", "比喻有恆心、有毅力，堅持不懈地克服困難"], "answer": 3, "difficulty": "hard", "stars": 3, "category": "學習"}, {"id": 201, "chengyu": "一無所有", "meaning": "什麼都沒有，形容極度貧窮或空無一物", "story": "形容一個人身無長物，什麼都沒有，可以用來形容財物上的貧乏，也可以形容某事物完全空無一物，是日常生活中常用的成語。", "question": "「一無所有」是什麼意思？", "options": ["什麼都沒有，形容極度貧窮或空無一物", "有很多東西", "一個人獨自生活", "無憂無慮"], "answer": 0, "difficulty": "beginner", "stars": 1, "category": "數字"}, {"id": 202, "chengyu": "一無是處", "meaning": "沒有一點優點，全部都是缺點", "story": "形容一個人或一件事物沒有任何值得稱讚的地方，全部都是缺點和問題，是一種非常負面的評價，使用時要注意場合。", "question": "「一無是處」是什麼意思？", "options": ["到處都是", "沒有一點優點，全部都是缺點", "一個地方都沒去", "處處都好"], "answer": 1, "difficulty": "beginner", "stars": 1, "category": "數字"}, {"id": 203, "chengyu": "一本萬利", "meaning": "投入少量資本，卻能獲得極大的利潤", "story": "比喻做生意或投資時，只需要很少的本錢，卻能獲得非常豐厚的利潤，是商人最希望達到的理想狀態。", "question": "「一本萬利」是什麼意思？", "options": ["一本書值萬元", "萬本書的利潤", "投入少量資本，卻能獲得極大的利潤", "一萬元的利息"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "數字"}, {"id": 204, "chengyu": "一帆風順", "meaning": "比喻做事非常順利，沒有任何阻礙", "story": "帆船航行時，若風向順利，帆船便能快速前進，毫無阻礙。後來比喻做事情一切順利，沒有任何困難，常用於祝福語。", "question": "「一帆風順」是什麼意思？", "options": ["帆船比賽", "風很大帆船翻了", "一個帆船的故事", "比喻做事非常順利，沒有任何阻礙"], "answer": 3, "difficulty": "beginner", "stars": 1, "category": "數字"}, {"id": 205, "chengyu": "一心一意", "meaning": "專心致志，全心全意做一件事", "story": "形容一個人把全部的心思和精力都放在一件事情上，不分心，不三心二意，專注地去完成目標，是做事成功的重要態度。", "question": "「一心一意」是什麼意思？", "options": ["專心致志，全心全意做一件事", "一個心願", "心意相通", "一個人的心意"], "answer": 0, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 206, "chengyu": "一日千里", "meaning": "形容進步或發展非常迅速", "story": "原指馬一天能跑千里路，後來比喻事情發展得非常快速，或者一個人進步得非常迅速，常用來形容科技發展或學習進步。", "question": "「一日千里」是什麼意思？", "options": ["一天走千里路", "形容進步或發展非常迅速", "千里之外", "一天很長"], "answer": 1, "difficulty": "beginner", "stars": 1, "category": "數字"}, {"id": 207, "chengyu": "一舉兩得", "meaning": "做一件事同時得到兩種好處", "story": "比喻做一件事情，同時能夠獲得兩種利益或好處，非常划算，與「一石二鳥」意思相近，是形容效率高的常用成語。", "question": "「一舉兩得」是什麼意思？", "options": ["舉起兩個東西", "兩次都得到", "做一件事同時得到兩種好處", "一次舉重比賽"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 208, "chengyu": "一鳴驚人", "meaning": "平時默默無聞，突然做出驚人之舉", "story": "出自《史記》，楚莊王三年不發號施令，大臣問他，他說：此鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人。後比喻平時沉默，突然有驚人表現。", "question": "「一鳴驚人」是什麼意思？", "options": ["鳥叫聲很大", "突然大叫嚇人", "一隻鳥的故事", "平時默默無聞，突然做出驚人之舉"], "answer": 3, "difficulty": "beginner", "stars": 1, "category": "動物"}, {"id": 209, "chengyu": "一言為定", "meaning": "說好的事情就算數，不能反悔", "story": "表示雙方說好的事情就算數，一言既出，駟馬難追，不能隨意更改或反悔，是一種誠信守諾的表現，常用於口頭約定。", "question": "「一言為定」是什麼意思？", "options": ["說好的事情就算數，不能反悔", "一句話的定義", "說話很有力量", "定下一個規則"], "answer": 0, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 210, "chengyu": "一塵不染", "meaning": "形容非常乾淨，或品格高潔，不受污染", "story": "原指佛教中心靈清淨，不受塵世污染的境界。後來比喻環境非常乾淨整潔，或者一個人品格高尚，不受不良風氣影響。", "question": "「一塵不染」是什麼意思？", "options": ["一粒灰塵", "不打掃房間", "形容非常乾淨，或品格高潔，不受污染", "染色的布料"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "品格"}, {"id": 211, "chengyu": "一見如故", "meaning": "初次見面就像老朋友一樣親切", "story": "形容兩個人第一次見面，就感覺非常投緣，像是認識已久的老朋友一樣，相處十分融洽，是形容人緣好或緣分深厚的成語。", "question": "「一見如故」是什麼意思？", "options": ["見到老朋友", "初次見面就像老朋友一樣親切", "故意見面", "見面很困難"], "answer": 1, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 212, "chengyu": "一知半解", "meaning": "知道得不多，了解得不夠透徹", "story": "形容對某件事情只知道一點點，了解得不夠深入和全面，似懂非懂，是一種學習不夠紮實的狀態，提醒人要深入學習。", "question": "「一知半解」是什麼意思？", "options": ["知道一半", "解決了一個問題", "知道得不多，了解得不夠透徹", "半知半解的謎題"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 213, "chengyu": "一氣呵成", "meaning": "一口氣完成，形容做事連貫流暢，不間斷", "story": "原指寫文章或做事情一口氣完成，中間不停頓，後來比喻做事情連貫流暢，一鼓作氣完成，不拖泥帶水，效率很高。", "question": "「一氣呵成」是什麼意思？", "options": ["一口氣完成，形容做事連貫流暢，不間斷", "生氣地完成", "呵欠連連", "氣氛很好"], "answer": 0, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 214, "chengyu": "一絲不苟", "meaning": "做事非常認真仔細，一點都不馬虎", "story": "形容做事情非常認真嚴謹，連一根絲線都不隨便，比喻對工作或學習態度極為認真負責，一絲不苟，是值得稱讚的精神。", "question": "「一絲不苟」是什麼意思？", "options": ["一根絲線", "做事非常認真仔細，一點都不馬虎", "不穿衣服", "絲綢很貴"], "answer": 1, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 215, "chengyu": "一步一腳印", "meaning": "做事踏實，一步一步認真地前進", "story": "比喻做事情踏踏實實，每一步都留下足跡，不投機取巧，認真努力地一步一步向前走，是腳踏實地的精神體現。", "question": "「一步一腳印」是什麼意思？", "options": ["走路留下腳印", "腳印很深", "做事踏實，一步一步認真地前進", "一個腳印的故事"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 216, "chengyu": "一分耕耘一分收穫", "meaning": "付出多少努力，就會得到多少回報", "story": "農耕時代的智慧，耕耘得越多，收穫就越多。比喻做任何事情都需要付出努力，有多少付出就有多少回報，天下沒有不勞而獲的事。", "question": "「一分耕耘一分收穫」是什麼意思？", "options": ["農夫的故事", "耕田的方法", "收穫季節", "付出多少努力，就會得到多少回報"], "answer": 3, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 217, "chengyu": "一石二鳥", "meaning": "做一件事同時達到兩個目的", "story": "源自英語諺語，比喻用一塊石頭打中兩隻鳥，形容一個行動同時獲得兩種好處，非常有效率，與「一箭雙鵰」意思相近。", "question": "「一石二鳥」是什麼意思？", "options": ["做一件事同時達到兩個目的", "石頭打鳥的遊戲", "兩隻鳥站在石頭上", "一個人做兩份工作"], "answer": 0, "difficulty": "beginner", "stars": 1, "category": "動物"}, {"id": 218, "chengyu": "一模一樣", "meaning": "完全相同，沒有任何差別", "story": "形容兩個事物或兩個人長得完全一樣，沒有任何差異，就像是用同一個模子做出來的一樣，是日常生活中非常常用的成語。", "question": "「一模一樣」是什麼意思？", "options": ["一個模型", "完全相同，沒有任何差別", "樣子很特別", "模仿別人"], "answer": 1, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 219, "chengyu": "一五一十", "meaning": "原原本本，詳細地說清楚", "story": "古時候計算時，五個一數、十個一數，形容計算得清清楚楚。後比喻把事情原原本本、詳詳細細地說清楚，不隱瞞任何細節。", "question": "「一五一十」是什麼意思？", "options": ["數字一五和一十", "數學計算", "原原本本，詳細地說清楚", "五加十等於十五"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "數字"}, {"id": 220, "chengyu": "一目了然", "meaning": "一眼就能看清楚，非常明顯易懂", "story": "形容事物非常清晰明白，只需要看一眼就能完全明白，不需要費力思考，是形容事情簡單明瞭的常用成語。", "question": "「一目了然」是什麼意思？", "options": ["一隻眼睛", "看不清楚", "了解目標", "一眼就能看清楚，非常明顯易懂"], "answer": 3, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 221, "chengyu": "一字千金", "meaning": "形容文章或詩詞寫得非常好，每個字都價值千金", "story": "出自《史記》，秦相呂不韋編寫《呂氏春秋》，懸賞說能增減一字者賞千金，後比喻文章寫得極好，字字珠璣，價值連城。", "question": "「一字千金」是什麼意思？", "options": ["形容文章或詩詞寫得非常好，每個字都價值千金", "一個字值一千元", "寫字賺錢", "千字文章"], "answer": 0, "difficulty": "beginner", "stars": 1, "category": "數字"}, {"id": 222, "chengyu": "一往無前", "meaning": "勇往直前，毫不退縮", "story": "形容一個人勇敢地向前衝，不畏困難，不退縮，一直向前進，是形容勇氣和決心的成語，常用來鼓勵人要有衝勁。", "question": "「一往無前」是什麼意思？", "options": ["往前走一步", "沒有前進", "勇往直前，毫不退縮", "前方沒有路"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 223, "chengyu": "一諾千金", "meaning": "形容說話算數，承諾非常可靠", "story": "出自《史記》，季布為人重信義，凡是答應的事必定做到，當時有「得黃金百斤，不如得季布一諾」之說，後比喻承諾極為可靠。", "question": "「一諾千金」是什麼意思？", "options": ["一千元的承諾", "諾言很多", "形容說話算數，承諾非常可靠", "金子很多"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "數字"}, {"id": 224, "chengyu": "一鼓作氣", "meaning": "趁著初起的勇氣和力量，一口氣把事情做完", "story": "出自《左傳》，曹劌論戰時說，打仗要一鼓作氣，等到第二次、第三次擊鼓，士氣就衰退了。後比喻趁著勇氣旺盛，一口氣完成任務。", "question": "「一鼓作氣」是什麼意思？", "options": ["打鼓的技巧", "趁著初起的勇氣和力量，一口氣把事情做完", "一個鼓的故事", "鼓聲很大"], "answer": 1, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 225, "chengyu": "一葉知秋", "meaning": "從一片落葉就能知道秋天來了，比喻從小事看出大趨勢", "story": "看到一片樹葉落下，就知道秋天到了。比喻從細微的跡象，就能預知事情的發展趨勢，是一種敏銳觀察力的體現。", "question": "「一葉知秋」是什麼意思？", "options": ["秋天的葉子", "一片葉子的故事", "葉子很多", "從一片落葉就能知道秋天來了，比喻從小事看出大趨勢"], "answer": 3, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 226, "chengyu": "不勞而獲", "meaning": "不付出努力，卻想得到成果", "story": "比喻一個人不願意付出辛苦和努力，卻想要輕鬆得到成果和利益，是一種不正確的態度，提醒人要靠自己的努力獲得成功。", "question": "「不勞而獲」是什麼意思？", "options": ["不付出努力，卻想得到成果", "努力工作", "獲得很多", "勞動的成果"], "answer": 0, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 227, "chengyu": "不知不覺", "meaning": "在不知道、沒有察覺的情況下發生", "story": "形容事情在不知不覺中發生，自己沒有意識到，等到發現時已經過去了很長時間或事情已經改變，是日常生活中很常用的成語。", "question": "「不知不覺」是什麼意思？", "options": ["知道但不覺得", "在不知道、沒有察覺的情況下發生", "覺得不知道", "不想知道"], "answer": 1, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 228, "chengyu": "不三不四", "meaning": "形容人品行不端，或事物不正派", "story": "形容一個人行為不正派，品行有問題，或者事物不倫不類，不像樣子。三和四在古代有正統之意，不三不四就是不正統、不像樣。", "question": "「不三不四」是什麼意思？", "options": ["數字三和四", "不是三也不是四", "形容人品行不端，或事物不正派", "三四個人"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 229, "chengyu": "不可思議", "meaning": "形容事情奇妙得令人難以想像或理解", "story": "源自佛教用語，指超越人類思維和語言所能表達的境界。後來比喻事情非常奇妙或出乎意料，令人難以想像和理解，是常用的驚嘆詞。", "question": "「不可思議」是什麼意思？", "options": ["不能思考", "形容事情奇妙得令人難以想像或理解", "議論紛紛", "不可以"], "answer": 1, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 230, "chengyu": "不約而同", "meaning": "沒有事先約定，卻做出了相同的行動", "story": "形容兩個或多個人，沒有事先商量或約定，卻在同一時間做出了相同的事情，說明大家的想法不謀而合，心有靈犀。", "question": "「不約而同」是什麼意思？", "options": ["約好一起", "不想約定", "沒有事先約定，卻做出了相同的行動", "同時到達"], "answer": 2, "difficulty": "beginner", "stars": 1, "category": "小學生"}, {"id": 231, "chengyu": "不恥下問", "meaning": "不以向地位低的人請教為恥，形容謙虛好學", "story": "出自《論語》，孔子稱讚衛國大夫孔圉不以向地位比自己低的人請教為恥，這種謙虛好學的精神值得稱讚，是求學的好態度。", "question": "「不恥下問」是什麼意思？", "options": ["不以向地位低的人請教為恥，形容謙虛好學", "不問問題", "向下面的人問路", "問問題很丟臉"], "answer": 0, "difficulty": "beginner", "stars": 1, "category": "學習"}, {"id": 232, "chengyu": "不知所措", "meaning": "不知道該怎麼辦，形容慌張失措", "story": "形容一個人遇到突發狀況或困難時，不知道該如何應對，手足無措，非常慌 function saveState() {

}
function loadState() {
  state.totalStars = parseInt(localStorage.getItem('chengyu_stars') || '0');
  state.history = JSON.parse(localStorage.getItem('chengyu_history') || '[]');
  state.wrongQuestions = JSON.parse(localStorage.getItem('chengyu_wrong') || '[]');

}

// ===== SHUFFLE =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleQuestion(q) {
  const indices = shuffle([0,1,2,3]);
  return {
    ...q,
    shuffledOptions: indices.map(i => q.options[i]),
    shuffledAnswer: indices.indexOf(q.answer),
  };
}

  const hideIdx = Math.floor(Math.random() * chars.length);
  const correctChar = chars[hideIdx];
  const displayChengyu = chars.map((c, i) => i === hideIdx ? '？' : c).join('');
  // Generate 3 wrong chars from other chengyu
  const wrongChars = new Set();
  const allChars = questions.flatMap(qq => [...qq.chengyu]).filter(c => c !== correctChar);
  const shuffledChars = shuffle(allChars);
  for (const c of shuffledChars) {
    if (wrongChars.size >= 3) break;
    wrongChars.add(c);
  }
  const options = shuffle([correctChar, ...wrongChars]);
  return {
    ...q,
    displayChengyu,
    shuffledOptions: options,
    shuffledAnswer: options.indexOf(correctChar),
    isFill: true,
    fillQuestion: `「${displayChengyu}」中的「？」是哪個字？`,
  };
}

// ===== NAVIGATION =====
let currentMainTab = 'home';
function showMainTab(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentMainTab = id;
  if (id === 'home') {
    document.getElementById('total-stars').textContent = state.totalStars;
  } else if (id === 'daily') {
    renderDaily();
  } else if (id === 'browse') {
    renderBrowse();
  } else if (id === 'progress-screen') {
    renderProgress();
  } else if (id === 'records') {
    showRecordsTab('history');
  }
}
function showScreen(id) { showMainTab(id); }

// ===== DIFFICULTY & MODE =====
function selectDiff(el) {
  document.querySelectorAll('.diff-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  state.difficulty = el.dataset.diff;
}
function selectMode(el) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  state.gameMode = el.dataset.mode;
}

// ===== GAME =====
function getQuestions(diff) {
  let pool;
  if (diff === 'mixed') {
    pool = shuffle(questions).slice(0, 10);
  } else {
    pool = shuffle(questions.filter(q => q.difficulty === diff)).slice(0, 10);
  }
  if (state.gameMode === 'fill') {
    return pool.map(makeFillQuestion);
  }
  return pool.map(shuffleQuestion);
}

function startGame(reviewMode = false) {
  let qs;
  if (reviewMode) {
    const pool = shuffle(state.wrongQuestions).slice(0, 10);
    qs = state.gameMode === 'fill' ? pool.map(makeFillQuestion) : pool.map(shuffleQuestion);
    state.difficulty = 'mixed';
  } else {
    qs = getQuestions(state.difficulty);
  }
  if (qs.length === 0) {
    alert('此難度暫無題目！');
    return;
  }
  state.currentQuestions = qs;
  state.currentIndex = 0;
  state.sessionStars = 0;
  state.sessionCorrect = 0;
  state.answered = false;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('game').classList.add('active');
  renderQuestion();
}

function renderQuestion() {
  const q = state.currentQuestions[state.currentIndex];
  const total = state.currentQuestions.length;
  const idx = state.currentIndex;

  document.getElementById('progress-info').textContent = `第 ${idx+1} / ${total} 題`;
  document.getElementById('session-stars').textContent = `⭐ ${state.sessionStars}`;
  document.getElementById('progress-bar').style.width = `${((idx+1)/total)*100}%`;

  if (q.isFill) {
    document.getElementById('chengyu-text').textContent = q.displayChengyu;
    document.getElementById('question-text').textContent = q.fillQuestion;
  } else {
    document.getElementById('chengyu-text').textContent = q.chengyu;
    document.getElementById('question-text').textContent = q.question;
  }

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.shuffledOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-label">${labels[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(i, btn);
    grid.appendChild(btn);
  });

  document.getElementById('feedback-box').style.display = 'none';
  document.getElementById('feedback-box').className = 'feedback-box';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('story-text').style.display = 'none';
  state.answered = false;
}

function selectAnswer(idx, btn) {
  if (state.answered) return;
  state.answered = true;
  const q = state.currentQuestions[state.currentIndex];
  const isCorrect = idx === q.shuffledAnswer;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    state.sessionStars += q.stars;
    state.sessionCorrect++;
    document.getElementById('session-stars').textContent = `⭐ ${state.sessionStars}`;
    showFeedback(true, q);
    popStars(q.stars);
    // Mark as mastered if answered correctly
    if (!state.masteredIds.includes(q.id)) {
      state.masteredIds.push(q.id);
    }
  } else {
    btn.classList.add('wrong');
    btns[q.shuffledAnswer].classList.add('correct');
    showFeedback(false, q);
    addWrong(q);
    // Remove from mastered if answered wrong
    state.masteredIds = state.masteredIds.filter(id => id !== q.id);
  }

  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('next-btn').textContent =
    state.currentIndex + 1 >= state.currentQuestions.length ? '查看結果 🎉' : '下一題 →';
}

function showFeedback(correct, q) {
  const box = document.getElementById('feedback-box');
  box.style.display = 'block';
  box.className = `feedback-box ${correct ? 'correct' : 'wrong'}`;
  document.getElementById('feedback-title').textContent = correct
    ? `✅ 答對了！+${q.stars}⭐`
    : `❌ 答錯了！正確答案是：${q.shuffledOptions[q.shuffledAnswer]}`;
  document.getElementById('feedback-text').textContent = q.meaning;
  document.getElementById('story-text').textContent = q.story;
  document.getElementById('story-text').style.display = 'none';
}

function toggleStory() {
  const s = document.getElementById('story-text');
  s.style.display = s.style.display === 'none' ? 'block' : 'none';
}

function nextQuestion() {
  if (state.currentIndex + 1 >= state.currentQuestions.length) {
    finishGame();
  } else {
    state.currentIndex++;
    renderQuestion();
  }
}

function finishGame() {
  const total = state.currentQuestions.length;
  const percent = Math.round((state.sessionCorrect / total) * 100);
  state.totalStars += state.sessionStars;

  const record = {
    date: new Date().toLocaleDateString('zh-TW'),
    difficulty: state.difficulty,
    stars: state.sessionStars,
    correct: state.sessionCorrect,
    total,
    percent,
  };
  state.history = [record, ...state.history].slice(0, 20);
  saveState();

  let emoji, label;
  if (percent === 100) { emoji = '👑'; label = '成語大師！'; }
  else if (percent >= 80) { emoji = '🌟'; label = '非常優秀！'; }
  else if (percent >= 60) { emoji = '😊'; label = '繼續加油！'; }
  else { emoji = '📚'; label = '多多練習！'; }

  document.getElementById('rank-emoji').textContent = emoji;
  document.getElementById('rank-label').textContent = label;
  document.getElementById('result-stars').textContent = `⭐ ${state.sessionStars}`;
  document.getElementById('result-correct').textContent = `${state.sessionCorrect} / ${total}`;
  document.getElementById('result-percent').textContent = `${percent}%`;
  document.getElementById('result-total').textContent = `⭐ ${state.totalStars}`;

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('result').classList.add('active');
}

function replayGame() { startGame(); }

// ===== WRONG QUESTIONS =====
function addWrong(q) {
  if (!state.wrongQuestions.find(w => w.id === q.id)) {
    state.wrongQuestions.push(q);
  }
}
function removeWrong(id) {
  state.wrongQuestions = state.wrongQuestions.filter(q => q.id !== id);
  saveState();
  showRecordsTab('wrong');
}
function clearWrong() {
  if (confirm('確定清空所有錯題？')) {
    state.wrongQuestions = [];
    saveState();
    showRecordsTab('wrong');
  }
}

// ===== RECORDS =====
let currentRecordsTab = 'history';
function showRecordsTab(tab) {
  currentRecordsTab = tab;
  document.getElementById('tab-history').className = `tab-btn ${tab === 'history' ? 'active' : ''}`;
  document.getElementById('tab-wrong').className = `tab-btn ${tab === 'wrong' ? 'active' : ''}`;
  const list = document.getElementById('records-list');

  if (tab === 'history') {
    if (state.history.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-emoji">📭</div><div class="empty-text">還沒有遊戲紀錄<br>快去玩一局吧！</div></div>`;
      return;
    }
    list.innerHTML = state.history.map((r, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
      return `<div class="record-item">
        <span class="record-medal">${medal}</span>
        <div class="record-info">
          <div class="record-diff">${DIFF_LABELS[r.difficulty] || r.difficulty}</div>
          <div class="record-score">答對 ${r.correct}/${r.total} (${r.percent}%) · ${r.date}</div>
        </div>
        <div class="record-stars">⭐ ${r.stars}</div>
      </div>`;
    }).join('');
  } else {
    if (state.wrongQuestions.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-emoji">🎉</div><div class="empty-text">錯題本是空的<br>繼續保持！</div></div>`;
      return;
    }
    list.innerHTML = `
      <button class="review-btn" onclick="startGame(true)">🔁 開始複習錯題 (${state.wrongQuestions.length} 題)</button>
      <button class="clear-btn" onclick="clearWrong()">🗑️ 清空錯題本</button>
      ${state.wrongQuestions.map(q => `
        <div class="wrong-item">
          <div class="wrong-chengyu">${q.chengyu}</div>
          <div class="wrong-meaning">${q.meaning}</div>
          <div class="wrong-actions">
            <button class="wrong-story-btn" onclick="toggleWrongStory(${q.id})">📖 典故</button>
            <button class="wrong-del-btn" onclick="removeWrong(${q.id})">✕ 刪除</button>
          </div>
          <div class="wrong-story" id="wrong-story-${q.id}">${q.story}</div>
        </div>
      `).join('')}
    `;
  }
}
function toggleWrongStory(id) {
  const el = document.getElementById(`wrong-story-${id}`);
  el.style.display = el.style.display === 'none' || !el.style.display ? 'block' : 'none';
}

// ===== DAILY =====
function getTodayStr() {
  return new Date().toLocaleDateString('zh-TW');
}
function getDailyQuestion() {
  const dayNum = Math.floor(Date.now() / 86400000);
  return questions[dayNum % questions.length];
}
function renderDaily() {
  const q = getDailyQuestion();
  const today = getTodayStr();
  document.getElementById('daily-date').textContent = today;
  document.getElementById('daily-chengyu').textContent = q.chengyu;
  document.getElementById('daily-meaning').textContent = q.meaning;
  document.getElementById('daily-story').textContent = q.story;
  document.getElementById('daily-streak').textContent = `${state.dailyStreak} 天`;

  const btn = document.getElementById('daily-check-btn');
  if (state.lastCheckedDate === today) {
    btn.textContent = '✅ 今日已打卡！';
    btn.className = 'daily-checked';
    btn.onclick = null;
  } else {
    btn.textContent = '✅ 今日已學習！打卡 +2⭐';
    btn.className = 'daily-check-btn';
    btn.onclick = checkDaily;
  }
}
function checkDaily() {
  const today = getTodayStr();
  if (state.lastCheckedDate === today) return;

  // Check if yesterday was checked for streak
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = yesterday.toLocaleDateString('zh-TW');
  if (state.lastCheckedDate === yesterdayStr) {
    state.dailyStreak++;
  } else {
    state.dailyStreak = 1;
  }
  state.lastCheckedDate = today;
  state.totalStars += 2;
  saveState();
  popStars(2);
  renderDaily();
  document.getElementById('total-stars').textContent = state.totalStars;
}

// ===== BROWSE =====
let currentCat = '全部';
function renderBrowse() {
  const cats = ['全部', ...new Set(questions.map(q => q.category))].filter(Boolean);
  const filterEl = document.getElementById('cat-filter');
  filterEl.innerHTML = cats.map(c =>
    `<button class="cat-btn ${c === currentCat ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`
  ).join('');
  renderBrowseList();
}
function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });
  renderBrowseList();
}
function renderBrowseList() {
  const filtered = currentCat === '全部' ? questions : questions.filter(q => q.category === currentCat);
  const list = document.getElementById('browse-list');
  list.innerHTML = filtered.map(q => {
    const mastered = state.masteredIds.includes(q.id);
    return `<div class="browse-item" onclick="toggleBrowseStory(${q.id})">
      <div class="browse-item-top">
        <span class="browse-chengyu">${q.chengyu}</span>
        <span class="browse-cat-tag">${q.category || '其他'}</span>
        ${mastered ? '<span class="mastered-badge">✅ 已掌握</span>' : ''}
      </div>
      <div class="browse-meaning">${q.meaning}</div>
      <div class="browse-story" id="browse-story-${q.id}">${q.story}</div>
    </div>`;
  }).join('');
}
function toggleBrowseStory(id) {
  const el = document.getElementById(`browse-story-${id}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

// ===== PROGRESS =====
function renderProgress() {
  const total = questions.length;
  const mastered = state.masteredIds.length;
  const seen = new Set(state.history.flatMap ? [] : []).size;
  const totalGames = state.history.length;
  const avgPercent = totalGames > 0
    ? Math.round(state.history.reduce((s, r) => s + r.percent, 0) / totalGames)
    : 0;

  document.getElementById('progress-summary').innerHTML = `
    <div class="progress-stat">
      <div class="progress-stat-val">${mastered}</div>
      <div class="progress-stat-label">已掌握成語</div>
    </div>
    <div class="progress-stat">
      <div class="progress-stat-val">${total}</div>
      <div class="progress-stat-label">題庫總數</div>
    </div>
    <div class="progress-stat">
      <div class="progress-stat-val">${totalGames}</div>
      <div class="progress-stat-label">遊戲局數</div>
    </div>
    <div class="progress-stat">
      <div class="progress-stat-val">${avgPercent}%</div>
      <div class="progress-stat-label">平均正確率</div>
    </div>
  `;

  // Mastered list
  const masteredQ = questions.filter(q => state.masteredIds.includes(q.id));
  const masteredEl = document.getElementById('mastered-list');
  if (masteredQ.length === 0) {
    masteredEl.innerHTML = '<div style="color:var(--muted);font-size:15px;">還沒有掌握的成語，快去答題吧！</div>';
  } else {
    masteredEl.innerHTML = masteredQ.map(q =>
      `<div class="mastered-tag">${q.chengyu}</div>`
    ).join('');
  }

  // Category progress
  const cats = [...new Set(questions.map(q => q.category))].filter(Boolean);
  const catEl = document.getElementById('cat-progress-list');
  catEl.innerHTML = cats.map(cat => {
    const catQs = questions.filter(q => q.category === cat);
    const catMastered = catQs.filter(q => state.masteredIds.includes(q.id)).length;
    const pct = Math.round((catMastered / catQs.length) * 100);
    return `<div class="cat-progress-item">
      <div class="cat-progress-label">
        <span>${cat}</span>
        <span>${catMastered}/${catQs.length} (${pct}%)</span>
      </div>
      <div class="cat-progress-bar-wrap">
        <div class="cat-progress-bar" style="width:${pct}%"></div>
      </div>
    </div>`;
  }).join('');
}

// ===== STAR ANIMATION =====
function popStars(count) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const star = document.createElement('div');
      star.className = 'star-pop';
      star.textContent = '⭐';
      star.style.left = (30 + Math.random() * 40) + '%';
      star.style.top = (40 + Math.random() * 20) + '%';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 900);
    }, i * 150);
  }
}

// ===== INIT =====
function init() {
  questions = INLINE_QUESTIONS;
  loadState();
  renderDaily();
}
init();
</script>
