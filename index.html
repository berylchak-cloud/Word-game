<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0" />
  <title>成語星星樂園 🌟</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #FF6B9D;
      --pink-light: #FFF0F5;
      --pink-border: #FDDDE6;
      --gold: #FFD700;
      --green: #4CAF50;
      --orange: #FF9800;
      --red: #F44336;
      --purple: #A78BFA;
      --blue: #4FC3F7;
      --teal: #26C6DA;
      --text: #3D2C35;
      --muted: #B8899A;
      --white: #FFFFFF;
      --surface: #FAFAFA;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 18px;
      background: linear-gradient(135deg, #FFF0F5 0%, #FFF8FC 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(255,107,157,0.1);
    }
    .screen { display: none; flex-direction: column; flex: 1; }
    .screen.active { display: flex; }

    /* ===== HOME ===== */
    #home { overflow-y: auto; }
    .home-content { padding: 24px 20px; flex: 1; }
    .logo-wrap { text-align: center; margin-bottom: 12px; }
    .logo-emoji { font-size: 64px; line-height: 1; }
    .app-title { font-size: 32px; font-weight: 800; color: var(--pink); letter-spacing: 2px; margin-bottom: 4px; text-align: center; }
    .app-sub { font-size: 16px; color: var(--muted); margin-bottom: 16px; text-align: center; }
    .stars-card {
      background: var(--pink-light);
      border: 2px solid var(--pink-border);
      border-radius: 20px;
      padding: 14px 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .stars-label { font-size: 16px; color: var(--muted); margin-bottom: 2px; }
    .stars-count { font-size: 40px; font-weight: 800; color: var(--gold); }
    .stars-count::before { content: "⭐ "; font-size: 26px; }
    .section-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 16px; }
    .diff-card {
      background: white;
      border: 2.5px solid var(--pink-border);
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .diff-card:hover { border-color: var(--pink); background: var(--pink-light); }
    .diff-card.selected { background: var(--pink-light); }
    .diff-card.selected.beginner { border-color: var(--pink); }
    .diff-card.selected.easy { border-color: var(--green); }
    .diff-card.selected.medium { border-color: var(--orange); }
    .diff-card.selected.hard { border-color: var(--red); }
    .diff-card.selected.mixed { border-color: var(--purple); }
    .diff-emoji { font-size: 24px; margin-bottom: 4px; }
    .diff-name { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .diff-card.selected.beginner .diff-name { color: var(--pink); }
    .diff-card.selected.easy .diff-name { color: var(--green); }
    .diff-card.selected.medium .diff-name { color: var(--orange); }
    .diff-card.selected.hard .diff-name { color: var(--red); }
    .diff-card.selected.mixed .diff-name { color: var(--purple); }
    .diff-desc { font-size: 13px; color: var(--muted); margin-bottom: 3px; }
    .diff-stars { font-size: 14px; font-weight: 700; color: var(--muted); }
    .diff-mixed { grid-column: 1 / -1; }
    .mode-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .mode-btn {
      flex: 1;
      padding: 12px 8px;
      border-radius: 14px;
      border: 2px solid var(--pink-border);
      background: white;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .mode-btn.selected { background: var(--pink-light); border-color: var(--pink); color: var(--pink); }
    .mode-btn:hover { background: var(--pink-light); }
    .start-btn {
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 28px;
      padding: 18px 60px;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255,107,157,0.4);
      transition: all 0.15s;
      width: 100%;
      margin-bottom: 8px;
    }
    .start-btn:hover { transform: scale(1.02); }
    .start-btn:active { transform: scale(0.97); }

    /* ===== NAV TABS ===== */
    .nav-tabs {
      display: flex;
      border-top: 1px solid var(--pink-border);
      background: white;
      position: sticky;
      bottom: 0;
    }
    .nav-tab {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
      border: none;
      background: none;
      transition: color 0.15s;
    }
    .nav-tab.active { color: var(--pink); font-weight: 700; }
    .nav-tab-icon { font-size: 24px; display: block; margin-bottom: 2px; }

    /* ===== GAME SCREEN ===== */
    #game {
      padding: 14px 16px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
    }
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
    .progress-info { font-size: 16px; color: var(--muted); font-weight: 600; }
    .session-stars { font-size: 18px; font-weight: 700; color: var(--gold); }
    .progress-bar-wrap { background: var(--pink-border); border-radius: 8px; height: 8px; margin-bottom: 10px; overflow: hidden; flex-shrink: 0; }
    .progress-bar { background: linear-gradient(90deg, var(--pink), #FF8EC0); height: 100%; border-radius: 8px; transition: width 0.4s; }
    .question-card {
      background: var(--pink-light);
      border: 2px solid var(--pink-border);
      border-radius: 18px;
      padding: 14px 16px;
      text-align: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .chengyu-text { font-size: 38px; font-weight: 800; color: var(--pink); letter-spacing: 6px; margin-bottom: 6px; }
    .question-text { font-size: 16px; color: var(--text); line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }
    .option-btn {
      background: white;
      border: 2.5px solid var(--pink-border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 16px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      line-height: 1.3;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .option-btn:hover:not(:disabled) { background: var(--pink-light); border-color: var(--pink); }
    .option-btn.correct { background: #E8F5E9; border-color: var(--green); color: #2E7D32; }
    .option-btn.wrong { background: #FFEBEE; border-color: var(--red); color: #C62828; }
    .option-btn:disabled { cursor: default; }
    .option-label {
      background: var(--pink-border);
      color: var(--pink);
      border-radius: 8px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }
    .option-btn.correct .option-label { background: #C8E6C9; color: #2E7D32; }
    .option-btn.wrong .option-label { background: #FFCDD2; color: #C62828; }
    .feedback-box {
      border-radius: 14px;
      padding: 10px 14px;
      margin-top: 8px;
      display: none;
      flex-shrink: 0;
    }
    .feedback-box.correct { background: #E8F5E9; border: 2px solid #A5D6A7; }
    .feedback-box.wrong { background: #FFEBEE; border: 2px solid #FFCDD2; }
    .feedback-title { font-size: 17px; font-weight: 800; margin-bottom: 3px; }
    .feedback-box.correct .feedback-title { color: #2E7D32; }
    .feedback-box.wrong .feedback-title { color: #C62828; }
    .feedback-text { font-size: 15px; color: var(--text); line-height: 1.5; }
    .story-toggle {
      background: none;
      border: 1.5px solid var(--pink);
      border-radius: 10px;
      color: var(--pink);
      font-size: 14px;
      padding: 5px 12px;
      cursor: pointer;
      margin-top: 6px;
      font-weight: 600;
    }
    .story-text { font-size: 14px; color: #555; line-height: 1.6; margin-top: 6px; display: none; background: white; border-radius: 10px; padding: 10px; max-height: 70px; overflow-y: auto; }
    .game-bottom { margin-top: auto; padding-top: 8px; flex-shrink: 0; }
    .next-btn {
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: none;
      transition: all 0.15s;
    }
    .next-btn:hover { transform: scale(1.02); }
    .next-btn:active { transform: scale(0.98); }

    /* ===== RESULT SCREEN ===== */
    #result { padding: 28px 20px; align-items: center; overflow-y: auto; }
    .rank-emoji { font-size: 64px; margin-bottom: 6px; }
    .rank-label { font-size: 28px; font-weight: 800; color: var(--pink); margin-bottom: 16px; }
    .result-card {
      background: var(--pink-light);
      border: 2px solid var(--pink-border);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      margin-bottom: 20px;
    }
    .result-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--pink-border); }
    .result-row:last-child { border-bottom: none; }
    .result-key { font-size: 17px; color: var(--muted); }
    .result-val { font-size: 19px; font-weight: 700; color: var(--text); }
    .result-stars-big { font-size: 30px; font-weight: 800; color: var(--gold); }
    .result-btns { display: flex; gap: 10px; width: 100%; }
    .result-btn {
      flex: 1;
      padding: 16px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .result-btn:active { transform: scale(0.97); }
    .btn-replay { background: var(--pink); color: white; box-shadow: 0 4px 14px rgba(255,107,157,0.35); }
    .btn-home { background: white; color: var(--pink); border: 2px solid var(--pink); }

    /* ===== RECORDS SCREEN ===== */
    #records { overflow-y: auto; flex: 1; }
    .records-header { padding: 18px 18px 0; }
    .records-header h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
    .tab-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab-btn {
      flex: 1;
      min-width: 70px;
      padding: 10px 6px;
      border-radius: 12px;
      border: 2px solid var(--pink-border);
      background: white;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .tab-btn.active { background: var(--pink-light); border-color: var(--pink); color: var(--pink); }
    .records-list { padding: 0 18px 18px; }
    .record-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--pink-light); border-radius: 14px; margin-bottom: 8px; }
    .record-medal { font-size: 20px; flex-shrink: 0; }
    .record-info { flex: 1; }
    .record-diff { font-size: 16px; font-weight: 600; color: var(--text); }
    .record-score { font-size: 13px; color: var(--muted); }
    .record-stars { font-size: 20px; font-weight: 800; color: var(--gold); }
    .wrong-item { background: var(--pink-light); border-radius: 14px; padding: 14px; margin-bottom: 8px; }
    .wrong-chengyu { font-size: 24px; font-weight: 800; color: var(--pink); margin-bottom: 4px; }
    .wrong-meaning { font-size: 16px; color: var(--text); margin-bottom: 8px; }
    .wrong-actions { display: flex; gap: 8px; }
    .wrong-story-btn {
      background: none;
      border: 1.5px solid var(--pink);
      border-radius: 8px;
      color: var(--pink);
      font-size: 14px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .wrong-del-btn {
      background: none;
      border: 1.5px solid #FFCDD2;
      border-radius: 8px;
      color: #E57373;
      font-size: 14px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .wrong-story { font-size: 14px; color: #555; line-height: 1.6; margin-top: 8px; display: none; background: white; border-radius: 8px; padding: 10px; }
    .review-btn {
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    .clear-btn {
      background: none;
      border: 1.5px solid #FFCDD2;
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 15px;
      color: #E57373;
      cursor: pointer;
      width: 100%;
      margin-bottom: 14px;
    }
    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 18px; color: var(--muted); line-height: 1.6; }

    /* ===== DAILY SCREEN ===== */
    #daily { padding: 24px 20px; overflow-y: auto; }
    .daily-header { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .daily-date { font-size: 15px; color: var(--muted); margin-bottom: 20px; }
    .daily-card {
      background: linear-gradient(135deg, #FFF0F5, #FFF8E7);
      border: 2px solid var(--pink-border);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .daily-chengyu { font-size: 48px; font-weight: 800; color: var(--pink); letter-spacing: 8px; margin-bottom: 12px; }
    .daily-pinyin { font-size: 16px; color: var(--muted); margin-bottom: 12px; letter-spacing: 4px; }
    .daily-meaning { font-size: 18px; color: var(--text); line-height: 1.6; margin-bottom: 16px; }
    .daily-story-wrap { background: white; border-radius: 16px; padding: 16px; text-align: left; }
    .daily-story-title { font-size: 15px; font-weight: 700; color: var(--pink); margin-bottom: 8px; }
    .daily-story { font-size: 15px; color: #555; line-height: 1.7; }
    .daily-streak { display: flex; align-items: center; gap: 12px; background: var(--pink-light); border-radius: 16px; padding: 14px 18px; margin-bottom: 16px; }
    .daily-streak-icon { font-size: 32px; }
    .daily-streak-info { flex: 1; }
    .daily-streak-label { font-size: 14px; color: var(--muted); }
    .daily-streak-count { font-size: 22px; font-weight: 800; color: var(--pink); }
    .daily-checked { background: var(--green); color: white; border: none; border-radius: 20px; padding: 14px; font-size: 17px; font-weight: 700; width: 100%; cursor: default; }
    .daily-check-btn { background: var(--pink); color: white; border: none; border-radius: 20px; padding: 14px; font-size: 17px; font-weight: 700; width: 100%; cursor: pointer; }

    /* ===== PROGRESS SCREEN ===== */
    #progress-screen { padding: 20px; overflow-y: auto; }
    .progress-header { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 16px; }
    .progress-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .progress-stat {
      background: var(--pink-light);
      border: 2px solid var(--pink-border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }
    .progress-stat-val { font-size: 28px; font-weight: 800; color: var(--pink); }
    .progress-stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .progress-section-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .mastered-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .mastered-tag {
      background: #E8F5E9;
      border: 1.5px solid #A5D6A7;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 15px;
      font-weight: 700;
      color: #2E7D32;
    }
    .cat-progress-item { margin-bottom: 14px; }
    .cat-progress-label { display: flex; justify-content: space-between; font-size: 15px; color: var(--text); margin-bottom: 5px; }
    .cat-progress-bar-wrap { background: var(--pink-border); border-radius: 8px; height: 10px; overflow: hidden; }
    .cat-progress-bar { background: linear-gradient(90deg, var(--pink), #FF8EC0); height: 100%; border-radius: 8px; transition: width 0.6s; }

    /* ===== BROWSE SCREEN ===== */
    #browse { overflow-y: auto; flex: 1; }
    .browse-header { padding: 18px 18px 0; }
    .browse-header h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
    .cat-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .cat-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 2px solid var(--pink-border);
      background: white;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .cat-btn.active { background: var(--pink); border-color: var(--pink); color: white; }
    .browse-list { padding: 0 18px 18px; }
    .browse-item {
      background: var(--pink-light);
      border: 1.5px solid var(--pink-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .browse-item:hover { border-color: var(--pink); }
    .browse-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .browse-chengyu { font-size: 22px; font-weight: 800; color: var(--pink); }
    .browse-cat-tag { font-size: 12px; background: white; border: 1px solid var(--pink-border); border-radius: 8px; padding: 2px 8px; color: var(--muted); }
    .browse-meaning { font-size: 15px; color: var(--text); }
    .browse-story { font-size: 14px; color: #666; line-height: 1.6; margin-top: 8px; display: none; background: white; border-radius: 10px; padding: 10px; }
    .mastered-badge { font-size: 14px; color: var(--green); font-weight: 700; }

    /* ===== STAR POP ANIMATION ===== */
    .star-pop {
      position: fixed;
      font-size: 28px;
      pointer-events: none;
      z-index: 9999;
      animation: starFly 0.9s ease-out forwards;
    }
    @keyframes starFly {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- HOME SCREEN -->
  <div id="home" class="screen active">
    <div class="home-content">
      <div class="logo-wrap"><div class="logo-emoji">🌟</div></div>
      <div class="app-title">成語星星樂園</div>
      <div class="app-sub">學習成語，收集星星！</div>
      <div class="stars-card">
        <div class="stars-label">累積星星</div>
        <div class="stars-count" id="total-stars">0</div>
      </div>
      <div class="section-title">選擇難度</div>
      <div class="diff-grid">
        <div class="diff-card beginner selected" data-diff="beginner" onclick="selectDiff(this)">
          <div class="diff-emoji">🌞</div>
          <div class="diff-name">小學生</div>
          <div class="diff-desc">一字頭・不字頭</div>
          <div class="diff-stars">⭐×1</div>
        </div>
        <div class="diff-card easy" data-diff="easy" onclick="selectDiff(this)">
          <div class="diff-emoji">🌸</div>
          <div class="diff-name">簡單</div>
          <div class="diff-desc">常見成語</div>
          <div class="diff-stars">⭐×1</div>
        </div>
        <div class="diff-card medium" data-diff="medium" onclick="selectDiff(this)">
          <div class="diff-emoji">🌟</div>
          <div class="diff-name">普通</div>
          <div class="diff-desc">進階成語</div>
          <div class="diff-stars">⭐×2</div>
        </div>
        <div class="diff-card hard" data-diff="hard" onclick="selectDiff(this)">
          <div class="diff-emoji">🔥</div>
          <div class="diff-name">困難</div>
          <div class="diff-desc">深度成語</div>
          <div class="diff-stars">⭐×3</div>
        </div>
        <div class="diff-card mixed diff-mixed" data-diff="mixed" onclick="selectDiff(this)">
          <div class="diff-emoji">🎲</div>
          <div class="diff-name">混合挑戰</div>
          <div class="diff-desc">所有難度混合</div>
          <div class="diff-stars">⭐×1~3</div>
        </div>
      </div>
      <div class="section-title">遊戲模式</div>
      <div class="mode-row">
        <div class="mode-btn selected" data-mode="normal" onclick="selectMode(this)">📝 選擇題</div>
        <div class="mode-btn" data-mode="fill" onclick="selectMode(this)">✏️ 填字模式</div>
      </div>
      <button class="start-btn" onclick="startGame()">開始遊戲 🚀</button>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showMainTab('home')"><span class="nav-tab-icon">🏠</span>首頁</button>
      <button class="nav-tab" onclick="showMainTab('daily')"><span class="nav-tab-icon">📅</span>每日</button>
